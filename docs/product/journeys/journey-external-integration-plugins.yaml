    shared_artifacts:
      client_id:
        source_of_truth: the app registration
        consumers: [apps page, n8n credential, consent request, activity record]
        integration_risk: LOW
      client_secret:
        source_of_truth: the app registration, write-only (SC-3)
        consumers: [shown once at registration or rotation, then nowhere]
        integration_risk: HIGH - must never be rendered again
      route_id:
        source_of_truth: the route record
        consumers: [API answers, route row, history]
        integration_risk: LOW
      signing_secret:
        source_of_truth: the webhook route, write-only (SC-3)
        consumers: [shown once on create or rotation (page or API answer), then only used to sign]
        integration_risk: HIGH - must never appear in a list answer, log or the API description
      scope_catalogue:
        source_of_truth: feature-delta OD-15 (issues:read, issues:write, routes:manage)
        consumers: [registration form, consent page wording, per-request access check, openapi.json security description]
        integration_risk: HIGH - the consent wording must mean exactly what the check enforces
      event_catalogue:
        source_of_truth: feature-delta D-2
        consumers: [webhook type field, API events field]
        integration_risk: HIGH
      event_id:
        source_of_truth: assigned once per event
        consumers: [webhook payload, retries, history]
        integration_risk: HIGH
      foundry_issue_url:
        source_of_truth: public address plus slugs
        consumers: [webhook url]
        integration_risk: MEDIUM

