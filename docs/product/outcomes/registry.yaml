- id: OUT-16
  kind: invariant
  summary: One card gesture means exactly one of open, scroll or move, decided by
    pointer type, where the press began (the grip or the card body), distance and
    hold
  feature: card-pointer-drag
  inputs:
  - shape: 'pointerdown on article.issue-card in #board-columns with pointerType mouse
      (primary button only), touch or pen, on the card''s grip ([data-card-grip], its
      last child) or on the rest of the card (the body), followed by movement, a hold,
      a release or a pointercancel'
  output:
    shape: 'Mouse: lifts once moved past 6 px anywhere on the card, the grip included;
      a release inside it is a click that opens the edit dialog, except on the grip,
      where a click opens nothing. Touch/pen on the grip: lifts once moved past 3 px,
      with no hold; its touchstart is defaultPrevented; a tap on it opens nothing and
      moves nothing. Touch/pen on the body: lifts after a 500 ms hold within 10 px,
      showing [data-card-arming] from the press to the lift; moving past 10 px first
      leaves the gesture to the browser (it scrolls, nothing lifts); releasing first
      is a tap that opens the edit dialog; its touchstart is never prevented; every
      exit before the lift clears [data-card-arming]. A lifted release never opens
      the dialog (one-shot click guard, reset on the next pointerdown). Non-primary
      mouse buttons and other pointers never drive a session. Lifted: html[data-card-dragging],
      the origin card marked [data-card-lifted] in its slot, a fixed carried copy under
      the pointer; zero of each, and zero [data-card-arming], after every exit. Every
      card, from both card sources, carries exactly one grip'
