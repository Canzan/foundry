# Product SSOT — validated Jobs-to-be-Done.
#
# Bootstrapped by the keycloak-sso DISCUSS wave (2026-08-21). This repo predates
# the SSOT model: 43 features under docs/feature/ were written in the old
# per-feature layout, and docs/guides/migrating-to-ssot-model/ does not exist
# here. Rather than block a feature on migrating 43 histories, this file starts
# empty-but-real and each new feature appends the job it validates. Back-filling
# prior features is deliberately NOT attempted — an invented job story for a
# shipped feature is worse than no entry.

jobs:
  - id: job-sso-signin
    title: Sign in to the issue tracker with the credentials I already use
    job_story: >
      When I open foundry to file or triage an issue, I want to sign in with the
      same Keycloak identity I already use for Grafana, Portainer and ArgoCD, so
      I can get to my board without remembering a password that exists only here.
    dimensions:
      functional: Reach an authenticated foundry session without a foundry-specific credential.
      emotional: Stop feeling that foundry is the odd one out — the tool with its own password.
      social: Present as the same person across the cluster; issues and comments carry one identity.
    forces:
      push: >
        foundry is the only service on the cluster with a private password. It is
        the one credential not in the password manager's SSO group, and the one
        most likely to be reset-by-email at the moment it is needed.
      pull: >
        One click from the foundry sign-in page to a signed-in board, with the
        same session semantics the local password path already produces.
      anxiety: >
        Losing access to my own issue tracker if Keycloak or LLDAP is down, or if
        an OIDC misconfiguration locks the account out after a cluster rebuild.
      habit: >
        Typing a foundry-specific password. It works today, so the SSO path must
        be strictly additive — not a migration that removes the fallback.
    opportunity:
      importance: high
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table is produced (the skill
        requires one only when multiple jobs compete).
    validated_by: docs/feature/keycloak-sso/feature-delta.md

  - id: job-instance-project-rename
    title: Correct a stale project name from the instance dashboard, not from psql
    job_story: >
      When a project's purpose has drifted from the name it was created with
      (the "Auth v2" migration project shipped and became the permanent
      identity platform), I want to see every project across my instance and
      correct its display name in place, so boards and reports stay legible
      for the people using them — without opening a production database
      session.
    dimensions:
      functional: Find any project in the instance and change its display name safely, with validation and authz.
      emotional: Stop dreading that the "right" fix is a hand-typed UPDATE against production.
      social: New team members read boards whose names describe what the project is now, not what it was during a migration.
    forces:
      push: >
        The only rename path today is SQL against the live database — no
        validation, no CSRF/authz rails, and (as code reading showed) a naive
        name UPDATE silently breaks the board's issue-card URLs, which are
        re-derived from the name at render time.
      pull: >
        One inline edit on the same instance dashboard already trusted for
        provisioning workspaces and granting super-admin.
      anxiety: >
        That renaming a project breaks bookmarked board URLs, issue keys
        (AUTH-7), or the change report. The feature answers this directly:
        display-name-only rename, slug and keys pinned stable by acceptance
        tests.
      habit: >
        SSH + psql works and is fast for a single operator. The web path must
        be strictly safer (validation, uniqueness, non-enumerable authz), not
        merely prettier, to displace it.
    opportunity:
      importance: medium
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table (the skill requires
        one only when multiple jobs compete). Importance medium — cosmetic on
        the surface, but the current workaround is production SQL with a
        hidden URL-breaking trap (D2), which is what makes it worth product
        treatment.
    validated_by: docs/feature/instance-admin-project-rename/feature-delta.md

  - id: job-instance-workspace-rename
    title: Correct a workspace's name from the instance dashboard, with the change on record
    job_story: >
      When a workspace's name no longer says what the workspace is ("Bailey
      Family" became the shared household-operations space), I want to
      correct it from the instance dashboard and keep a record of the change,
      so every member's sidebar reads right and I can later answer "who
      renamed this, and what was it called before?" without opening a
      production database session.
    dimensions:
      functional: >
        Change any workspace's display name safely (authz, CSRF, a length rule
        that keeps the sidebar legible), with each effective change recorded
        as actor, old name, new name, and time.
      emotional: >
        Stop wincing at a wrong label every member reads on every page, and
        stop fixing it with an untraceable hand-typed UPDATE.
      social: >
        Members see a workspace named for what it is now; a second
        super-admin can see who changed it and from what.
    forces:
      push: >
        The only path is SQL against production: no length rule (the 240px
        sidebar brand has no truncation, so a long name breaks the shell) and
        no trace of who renamed what. Since multi-workspace tenancy (0009)
        there can be several workspaces, and more than one super-admin.
      pull: >
        The same inline row rename already shipped for projects on the same
        dashboard, plus an audit entry the operator can query.
      anxiety: >
        That renaming disturbs members' sessions, invites or URLs (it does
        not: workspaces have no slug; the id is the identity), or that a
        rename lands without its audit entry.
      habit: >
        psql is fast for a single operator. The web path must be safer
        (validation, authz, audit), not merely prettier.
    opportunity:
      importance: medium
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table. Sibling of
        job-instance-project-rename rather than a widening of it: the object
        differs (the tenant label every member sees in the shell) and the job
        adds accountability (audit), which the project job explicitly left
        out.
    validated_by: docs/feature/instance-admin-workspace-rename/feature-delta.md
    relates_to:
      - job: job-instance-project-rename
        relation: >
          Sibling. Same operator, same dashboard, same row-rename idiom; this
          job owns the workspace label and adds an append-only rename record.

  - id: job-instance-workspace-naming
    title: Name a workspace right at whichever door it is created or renamed through
    job_story: >
      When I name a workspace, whether provisioning it from the instance
      dashboard or from `foundry doctor provision-workspace`, claiming a fresh
      instance, or renaming it later, I want every one of those doors to
      refuse the same bad names for the same stated reason at the moment I
      type them (blank, longer than the sidebar can show, or carrying an
      invisible control character), so no workspace starts life with a label
      I must later correct, and every place its name is printed (sidebar,
      invite email, CLI output) shows one clean line.
    dimensions:
      functional: >
        One rule (trim, non-empty, no control characters, at most 24 Unicode
        scalars) with one set of refusal messages on all four doors. A
        refusal creates nothing, burns no bootstrap link, and keeps the
        first-admin email free for the retry.
      emotional: >
        Stop discovering, a page load after provisioning, that the name I
        just chose is truncated or is not what I typed. Trust that the door I
        happen to use does not decide what is allowed.
      social: >
        A new workspace admin's first sidebar already reads right. Nobody
        receives an invite email with a stray line break in the workspace
        name.
    forces:
      push: >
        Since v0.9.0 the rename door refuses names that the three creation
        doors accept (code reading, instance-admin-workspace-rename D10). The
        dashboard Provision form accepts "   " and creates a nameless
        workspace. The CLI does not even trim, and it echoes a newline in the
        name into its key: value stdout, forging lines. A NUL produces
        "internal error" on every door.
      pull: >
        The rule and copy the rename door already shows, applied everywhere,
        plus a stated reason for invisible characters.
      anxiety: >
        That a refused provision or claim leaves half-made rows behind,
        burning the first-admin email or the one-time bootstrap link; that
        existing long or odd legacy names suddenly break; and that a valid
        emoji or accented name gets refused.
      habit: >
        Typing or pasting any name and fixing it afterwards with a rename.
        Scripts call the CLI with whatever name they are given. The rule must
        refuse with a stable exit code and leave legacy names alone.
    opportunity:
      importance: medium
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table. Satisfaction low:
        1 of 4 doors enforces any rule, and none refuses control characters.
        Sibling of job-instance-workspace-rename rather than a widening of
        it. That job's situation is drift and its distinctive outcome is
        accountability (audit). This job's situation is creation at any door
        and its outcome is one consistent rule. Grounded in code reading, not
        interviews (no DISCOVER), the same recorded risk as its sibling.
    validated_by: docs/feature/instance-workspace-name-rule/feature-delta.md
    relates_to:
      - job: job-instance-workspace-rename
        relation: >
          Sibling. The rename door is one of this job's four doors. This job
          adds the control-character refusal to it and keeps that job's no-op
          precedence for legacy names unchanged.

  - id: job-project-naming
    title: Name a project right at whichever door it is created or renamed through
    job_story: >
      When I name a project, whether creating a board for my team at
      /team/{team}/projects/new or correcting a name from the instance
      dashboard, I want both doors to refuse the same bad names for the same
      stated reason (blank, longer than 256 characters, carrying an invisible
      control character, or already used in the team), and to mean the same
      thing by "unique within the team", so no project starts life with a
      name the other door would refuse, and the team never sees two projects
      it cannot tell apart.
    dimensions:
      functional: >
        One rule (trim, non-empty, no control characters from the workspace
        rule's set, at most 256 Unicode scalars, team-scoped uniqueness by
        case-insensitive name or slug) with one set of refusal messages on
        both doors. A refusal creates nothing and keeps the key prefix free
        for the retry.
      emotional: >
        Stop discovering after the fact that the board I just made carries a
        pasted tab, or sits next to a lookalike of a project that was renamed.
        Trust that the door I happen to use does not decide what is allowed.
      social: >
        Teammates picking a project in the new-issue dialog see one
        "Identity Platform", not two, and every board heading reads as one
        clean line.
    forces:
      push: >
        The member-facing create form trims and checks for blank, and nothing
        else: no length cap, no control-character check, and uniqueness by
        slug only. So after a rename, create mints a case-insensitive
        duplicate (project-rename residual D7). The admin rename door refuses
        names create accepts. A NUL produces "internal error" on both doors.
        The workspace doors already refuse control characters (v0.10.0).
      pull: >
        The rule and copy the rename door already shows, applied at create,
        plus the workspace rule's control-character refusal on both.
      anxiety: >
        That a valid emoji, accented or Persian name gets refused; that
        existing long, tab-containing or duplicate legacy names suddenly break
        or block an untouched rename; that a refused create burns the key
        prefix.
      habit: >
        Typing or pasting any name and asking an instance admin to rename it
        later. The rule must refuse with a stated reason and leave legacy
        names alone.
    opportunity:
      importance: medium
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table. Satisfaction low:
        the two doors disagree on length and uniqueness, and neither refuses
        control characters. Sibling, not an extension:
        job-instance-workspace-naming's object is the workspace and its actor
        is always the super-admin, whereas the create door here is a team
        member's; job-instance-project-rename's situation is drift, this job's
        is creation at either door with one consistent rule. Grounded in code
        reading, not interviews (no DISCOVER), the same recorded risk as its
        siblings.
    validated_by: docs/feature/project-name-rule/feature-delta.md
    relates_to:
      - job: job-instance-project-rename
        relation: >
          Sibling. The rename door is one of this job's two doors. This job
          adds the control-character refusal there, keeps its no-op
          precedence, and extends its uniqueness definition to create
          (closing that feature's D7 residual).
      - job: job-instance-workspace-naming
        relation: >
          Same shape for a different object. This job reuses that job's
          control-character set and copy pattern verbatim.

  - id: job-dismiss-edit-dialog
    title: Back out of an issue's edit dialog without saving, the way every other app allows
    job_story: >
      When I open an issue's edit dialog just to read it, or start an edit I
      decide against, I want a visible, conventional way to close it without
      saving, so I can get back to the board without hunting for the Esc key
      or saving a change I did not mean to make.
    dimensions:
      functional: Leave the edit dialog without saving, in one visible pointer action.
      emotional: Stop feeling cornered by a dialog whose only labeled button is Save.
      social: Anyone shown the board can close a dialog without being taught the unadvertised Esc handshake.
    forces:
      push: >
        The dialog offers Save and a full-page link; the only no-save exit is
        the Esc key, which nothing on screen advertises. A mouse user has no
        way out at all — verified against the template and keyboard.js, where
        Esc is the sole dismiss path and no backdrop-click close exists.
      pull: >
        The × every other dialog in every other tool has — one click, top
        right, back to the board.
      anxiety: >
        That the × might save half-typed edits, navigate away like the
        neighbouring "Open full page" link, or be invisible to keyboard and
        screen-reader use.
      habit: >
        Keyboard users already press Esc. The × must be strictly additive:
        Esc stays byte-identical, with its single owner in keyboard.js.
    opportunity:
      importance: low
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table (the skill requires
        one only when multiple jobs compete). Importance low — a small
        conventional affordance — but the current state fails a basic
        usability heuristic (user control and freedom: no visible escape),
        and the fix is under half a day.
    validated_by: docs/feature/issue-edit-modal-close-icon/feature-delta.md

  - id: job-board-lane-shaping
    title: Shape a project's board lanes to match how the work actually flows
    job_story: >
      When my board's lanes have drifted from how the work actually flows —
      lanes I never use, a name the team stopped saying, a stage the board
      cannot represent, a lane that is right but in the wrong place — I want
      to start new boards lean and then shape them in place: rename a lane,
      insert one where it belongs, move one left or right, and delete one
      (deciding on the spot whether its cards move or go), all from the same
      unobtrusive control, so each board reads as my actual process — in the
      direction the work actually travels — rather than the tool's default or
      a shape I can only ever tighten.
    dimensions:
      functional: Start projects with three lanes, and rename, insert, reorder or remove any lane in place — reordering costing no card and no lane identity, removal carrying an explicit, counted choice about the fate of its cards.
      emotional: Stop scanning past dead columns, and stop working beside a header that keeps a destructive control permanently armed; the board is mine, not a template I tolerate.
      social: Anyone shown the board sees only stages that mean something, under the names the team actually says — no "what goes in Todo vs Backlog?" tour.
    forces:
      push: >
        Every project renders the same four hardcoded columns — the lane set
        lives in a DB CHECK constraint and a Rust const — and a fifth state,
        cancelled, renders on no board at all, so cancelled issues are
        invisible outside search. The only "fix" today is ignoring the dead
        column forever. A lane's POSITION is likewise fixed at the moment it is
        created: moving one means deleting it and inserting a replacement,
        which forces an irreversible decision about every card inside it, and
        mints a new slug — paying with the lane's identity for a cosmetic
        change.
      pull: >
        A delete control on the column itself, with the same confirm-dialog
        care the rest of the app shows — and new projects that start lean. For
        position specifically: grab the column and slide it, the way every
        board tool works, or ask the same menu that already renames and
        inserts.
      anxiety: >
        That deleting a lane silently eats the cards inside it, or strands
        them invisible the way cancelled issues are stranded today. The
        prompt answers this directly: every card is explicitly moved or
        explicitly deleted, never dropped.
      habit: >
        Four columns is what every board has looked like since slice 1.
        Existing boards must render identically until the operator chooses
        otherwise — the new defaults apply to NEW projects only; migration
        never deletes a lane. Cards are dragged already; lanes dragging by a
        different mechanism must still feel the same to the hand, and must
        never steal the card gesture.
    opportunity:
      importance: high
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table (the skill requires
        one only when multiple jobs compete). Importance was medium at first
        validation — cosmetic at a glance, but the current state hid a real
        defect (cancelled issues rendered on no board) and blocked every
        workflow that was not the hardcoded one. Re-scored on extension (2026-09-02): unchanged at
        medium/low — the board-lane-overflow-menu extension widens the job
        from delete-only to full shaping, which raises satisfaction only once
        it ships. Re-scored again on the reorder extension (2026-09-03):
        importance RAISED to high, satisfaction unchanged at low. Importance
        rises because the workaround for a mis-positioned lane is uniquely
        expensive — delete-and-reinsert destroys the lane's identity and forces
        a card-fate decision to achieve a cosmetic change — and because
        reordering is the last verb standing between this job and the shaping
        it names.
    validated_by:
      - docs/feature/board-lane-management/feature-delta.md
      - docs/feature/board-lane-overflow-menu/feature-delta.md
      - docs/feature/board-lane-reorder/feature-delta.md
    scope_history:
      - date: 2026-08-2x
        by: docs/feature/board-lane-management/feature-delta.md
        change: >
          Job validated and first satisfied for DELETE only. That feature's D9
          explicitly deferred add, rename and reorder, and pre-registered the
          successor feature.
      - date: 2026-09-02
        by: docs/feature/board-lane-overflow-menu/feature-delta.md
        change: >
          Job WIDENED from delete-only to shaping — rename and insert added,
          all three verbs moved behind one per-column overflow menu so the
          column header no longer arms a destructive control by default.
          Archive was offered and DECLINED (that feature's D1): foundry has no
          archive concept, and adding one would create a second way for a card
          to be invisible — the exact failure board-lane-management D1(b)
          removed. Reordering lanes remains deferred.
      - date: 2026-09-03
        by: docs/feature/board-lane-reorder/feature-delta.md
        change: >
          Job WIDENED a third time — REORDER added, closing the last verb
          board-lane-management D9 deferred. Two surfaces, one write port: a
          Pointer Events drag on the column header (chosen over the card
          drag's HTML5 mechanism, which emits nothing on touch — D3), and Move
          list left / Move list right in the same overflow menu, which is the
          keyboard and assistive-technology path (D4). A move is position-only:
          zero issue rows, zero change events, zero slug or label mutations
          (D1). The insert shuffle's two-statement shape does NOT generalise —
          a move has no vacated slot to shift into — so the permutation must
          commit in one statement (D8), this feature's highest-uncertainty
          point.

  - id: job-canzan-theme
    title: Read my board in the light my room needs, in an app that wears the canzan face
    job_story: >
      When I open foundry late — after Grafana, Portainer and ArgoCD have all
      quietly gone dark because my machine asked them to — I want foundry to
      follow that same preference, and to let me overrule it for this one app
      when my device is set the other way, so I can work a long triage session
      without glare and without foundry looking like the one tool that was
      never finished.
    dimensions:
      functional: >
        Render every foundry screen in the light level the operator's
        environment demands — the device's preference by default, an explicit
        per-app choice when the device is set the other way — and do it in
        canzan's own palette and typography rather than a private one.
      emotional: >
        Stop bracing for the white page at 23:40. Stop reading foundry as the
        prototype in a cluster of finished tools.
      social: >
        Show foundry beside canzan.net and canzan-lift and have the three read
        as one product with one visual identity, not three side projects.
    forces:
      push: >
        foundry has no dark mode at all — the stylesheet's own header states
        the scope as "NOT a design system, theming, or dark mode", and all 637
        lines were authored light-only. Forty-six colour literals sit outside
        the token block, so even the parts that look tokenised are not. The
        only recourse today is dimming the monitor or a contrast extension
        that mangles the board layout. foundry also carries a second, private
        accent set (blue #2452c9 in the base rules, indigo #5b5bd6/#4f46e5 in
        the rail and dashboard) that appears nowhere else in canzan.
      pull: >
        canzan.net already publishes a complete two-palette token contract,
        and canzan-lift already ships a working three-state control that has
        survived a release. Adopting both is cheaper than inventing either,
        and it is the only route to "one theme everywhere".
      anxiety: >
        That a restyle silently breaks the acceptance suite — foundry's
        semantic classes ARE the render contract the suite selects on; that
        dark mode ships with unreadable pairs because the palette was trusted
        rather than measured (it does not survive measurement unamended:
        --cz-faint fails 4.5:1 in BOTH palettes at body size); and that the
        toggle introduces a white flash on every navigation, trading one
        irritation for a worse one.
      habit: >
        The board's geometry is muscle memory — column positions, card shape,
        the keyboard selection ring, j/k/?. The restyle must change colour and
        type and nothing else; a layout that moved would cost more than the
        glare it fixed. Equally, an operator who has never touched a theme
        control must keep getting exactly what the device says.
    opportunity:
      importance: medium
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table (the skill requires
        one only when multiple jobs compete). Importance medium — appearance
        rather than capability, but the current state is a real comfort and
        accessibility gap (no dark palette exists at all for a dark-preferring
        operator), and it is the feature that makes "one canzan" true or false
        across three shipped applications.
    validated_by: docs/feature/canzan-theme-system/feature-delta.md

  - id: job-issue-card-delete
    title: Remove a card that should not exist, without destroying the lane it sits in
    job_story: >
      When a card on my board should not exist — a duplicate I filed twice from
      two machines, a title I typo'd into the key, a note that belongs on
      another board, a test card from the day I was proving the board worked —
      I want to remove it from wherever I am already looking at it, and know
      exactly what goes with it before I commit, so my board only shows work
      that is real, without destroying the lane it happens to sit in.
    dimensions:
      functional: >
        Remove one issue, and everything hanging off it, from either surface
        that already opens it — the edit popup and the full issue page — in a
        bounded number of deliberate actions, with the consequence stated and
        counted before it happens.
      emotional: >
        Stop treating the board as append-only. Stop feeling that a misfiled
        card is permanent furniture, and stop weighing "is this duplicate worth
        nuking the whole lane for?"
      social: >
        Anyone shown the board reads only work that is real — no "ignore that
        one, it's a duplicate" tour, the same tour job-board-lane-shaping
        removed for dead columns.
    forces:
      push: >
        There is no card delete at any granularity below a lane. The only
        in-app removal is delete_lane_with_fate(..., DeleteCards), whose blast
        radius is every card in the lane; the alternative is SQL against the
        live database. A board therefore only ever grows, and the operator
        learns not to file speculatively — which costs more than the clutter.
      pull: >
        A Delete on the card she already has open, with the same confirm-dialog
        care the lane delete shows: it names the issue, counts what goes with
        it, and says it cannot be undone.
      anxiety: >
        That deleting an issue quietly takes comments, attachments and history
        with it without saying so; that it can be triggered by a misclick next
        to Save on the dialog she opens mostly to READ; that it half-succeeds
        and leaves orphaned rows; and that the board keeps showing the card
        afterwards, so she cannot tell whether it worked.
      habit: >
        The board is append-only today, and the edit popup's only buttons are
        Save and the close ×. Delete must not move, restyle or endanger either
        — the popup must stay safe to open, read and dismiss, which is what the
        operator mostly does with it (the persona records that she "opens issue
        cards as often to READ as to edit").
    opportunity:
      importance: high
      satisfaction: low
      note: >
        Single-job feature; no comparative scoring table (the skill requires
        one only when multiple jobs compete). Importance high because the
        workaround is not merely inconvenient but disproportionate to the point
        of being unusable — destroying an entire lane's cards to remove one —
        so in practice the capability is absent rather than awkward.
    validated_by: docs/feature/issue-card-delete/feature-delta.md
    relates_to:
      - job: job-board-lane-shaping
        relation: >
          Sibling, not overlap. That job owns the LANE verbs (rename, insert,
          move, delete) and, as a fate of lane delete, the bulk destruction of
          a lane's cards. This job owns the CARD verb at single-card
          granularity. Its D1 (archive declined — "adding one would create a
          second way for a card to be invisible") is inherited here as the
          binding reason issue delete is a HARD delete rather than a tombstone:
          see docs/feature/issue-card-delete/feature-delta.md D1 and its
          Changed Assumptions section.

  - id: job-board-card-move
    title: Put a card where it belongs on the board, and trust the drop to land there
    job_story: >
      When a card on my board is in the wrong lane or the wrong place in its
      lane — work started, work finished, a card that should be next — I want
      to drag it to exactly the spot I mean, with a mouse at my desk or with a
      finger on my phone, and see, before I let go, which lane and which slot
      will take it, so the board reads in the order the work is really in,
      without checking afterwards whether the drop landed, reloading the page
      first in case it will not, or waiting until I am back at a desk.
    dimensions:
      functional: >
        Move one card to a chosen lane and a chosen slot within it in one
        gesture, with the destination visible before release, at any point in
        a session — including straight after the board refreshed itself — on
        any pointer: mouse, touch or pen. On touch the gesture must coexist
        with scrolling the board and with tapping a card to open it
        (card-pointer-drag widening, 2026-09-25).
      emotional: >
        Stop distrusting the drag: no reflex reload before moving a card, no
        second look to see whether it took.
      social: >
        The board's order is the team's shared reading of what is next; a card
        that lands where it was aimed keeps that reading honest.
    forces:
      push: >
        Card drops are silently refused after any in-place board refresh — a
        card delete from the popup (since 87282d3) or any lane edit, insert,
        move or delete — until a reload, because the drag wires each lane once
        at page load. Nothing shows which lane or which slot will take the
        card. "No issues yet" lingers after a drop into an empty lane and is
        missing from a lane just emptied. (RCA:
        docs/feature/card-drag-drop-feedback/rca-drag-after-board-replace.md)
      pull: >
        What every board tool does: the lane lights up, a line opens between
        two cards, and the card drops into that gap.
      anxiety: >
        That the new highlights flicker or linger after the drag; that a file
        dragged in from the desktop starts moving cards; that the marker shows
        one place and the card lands in another.
      habit: >
        She already drags cards daily and they already land at the slot under
        the cursor (card-ranking-within-status). Feedback must add to that
        gesture, not change it — same drop semantics, same request, same
        revert.
      touch_delta: >
        Added by card-pointer-drag DISCUSS (2026-09-25); the four forces above
        still hold. PUSH: on a phone a card cannot be dragged at all — the
        card drag is native HTML5 drag-and-drop, which the shipped design
        treats as inert on touch (ADR-BOARD-LANE-007) — while the lane header
        right above it CAN be dragged by finger since board-lane-reorder, so
        the board reads as half-broken; the only touch path is open the card,
        change Status, save, which cannot choose a slot. PULL: press and hold
        a card, feel it lift, carry it to the lane and the gap, let go — the
        way every mobile board app works. ANXIETY: that a swipe meant to
        scroll the board grabs a card instead; that a tap meant to open a card
        starts a drag; that a system gesture or an incoming call mid-drag
        leaves a card stranded half-moved; that the desktop drag — which
        works — gets worse to fix the phone. HABIT: mouse users already drag
        with an immediate lift and Escape to cancel; touch users already
        swipe the board to scroll and tap a card to open it. The new gesture
        must take nothing from either.
    opportunity:
      importance: high
      satisfaction: low
      touch_note: >
        card-pointer-drag re-scores the touch dimension only: importance
        medium-high (Priya triages from her phone away from the desk; the lane
        drag already works there, so the missing card drag is conspicuous —
        ADR-BOARD-LANE-007 Consequences), satisfaction zero on touch (no
        gesture exists). The mouse dimension is satisfied since
        card-drag-drop-feedback and must stay so.
      note: >
        Single-job feature; no comparative scoring table. Not a back-fill: the
        move capability shipped in issue-status-move and
        card-ranking-within-status, which predate the SSOT and are deliberately
        not retro-validated. This entry is validated by the feature that found
        the gesture silently broken after everyday actions. Importance high —
        the board's core daily gesture; satisfaction low — refused without an
        error after the actions an operator performs several times a session.
    validated_by:
      - docs/feature/card-drag-drop-feedback/feature-delta.md
      - docs/feature/card-pointer-drag/feature-delta.md
    scope_history:
      - date: 2026-09-13
        by: docs/feature/card-drag-drop-feedback/feature-delta.md
        change: >
          Job validated. Mouse drag made replace-proof and given lane
          activation, a slot marker and truthful empty-lane placeholders.
          Touch and keyboard moves explicitly deferred (that feature's D14).
      - date: 2026-09-25
        by: docs/feature/card-pointer-drag/feature-delta.md
        change: >
          Widened to touch and pen. The card drag converges onto Pointer
          Events (the first deferred successor of ADR-BOARD-LANE-007): touch
          and pen lift by press-and-hold, mouse keeps an immediate lift past a
          movement threshold, and every card-drag-drop-feedback behaviour is
          preserved. A keyboard card move remains deferred.
    relates_to:
      - job: job-board-lane-shaping
        relation: >
          Sibling. That job's lane verbs (edit, insert, move, delete) are four
          of the six in-place board refreshes that broke this job's gesture.
      - job: job-issue-card-delete
        relation: >
          Sibling. Its popup delete (87282d3) made the board refresh an everyday
          action, turning a latent defect in this job's gesture into a daily one.

  - id: job-confirm-release-serving
    title: Confirm from the app itself that the build I just pushed is the one serving
    job_story: >
      When I push a release tag, I want to see which release the instance is
      actually serving, so I know the rollout finished without checking Argo CD
      or the pod image.
    dimensions:
      functional: >
        Read, from any full page including the signed-out sign-in page, which
        release the running binary is (US-RVF-01) and which commit and commit
        date it was built from (US-RVF-02), in one page load.
      emotional: >
        Stop wondering whether the rollout landed. Stop trusting a version
        number that reads the same for every build between two tags.
      social: >
        Not established by any wave. The persona runs a single-operator
        instance, and nothing here claims an audience beyond her.
    forces:
      push: >
        Before US-RVF-01, the app said nothing about what it was running. The
        only checks were Argo CD or the pod image. After it, `Foundry v0.7.0`
        names a release, not a build. Forgejo's build-and-publish.yml builds an
        image on every push to main as well as on v* tags, so every build
        between two tags (and a stale re-pulled image) reads identically.
      pull: >
        One glance at /sign-in, with no account and no cluster access. This is
        canzan-lift's footer stamp (version · commit date, SHA in data-commit),
        which already ships beside foundry.
      anxiety: >
        That the stamp lies with confidence (a stale SHA from a cached build),
        reads `unknown` in production because the container build has no .git
        (canzan-lift's fix-build-stamp-unknown-in-container RCA), or breaks the
        build on a machine without git.
      habit: >
        She already verifies every rollout from the /sign-in footer (v0.6.0
        through v0.7.0). The stamp must extend that check in place, without
        moving the footer, changing the layout, or adding a step.
    opportunity:
      importance: medium
      satisfaction: medium
      note: >
        Single-job feature; no comparative scoring table (the skill requires one
        only when multiple jobs compete). Importance medium: it is a
        verification aid, not a capability, but it is used on every release.
        Satisfaction is medium after US-RVF-01, because the release check works
        but the build check does not. US-RVF-02 targets the build check.
        Registered retroactively on 2026-10-04: US-RVF-01 (2026-09-26) stated
        this job in prose before this entry existed. That is not a back-fill of
        an invented job; the job story above is US-RVF-01's own wording.
    validated_by:
      - docs/feature/release-version-footer/feature-delta.md
    scope_history:
      - date: 2026-09-26
        by: docs/feature/release-version-footer/feature-delta.md
        change: >
          US-RVF-01: job stated and first satisfied for the RELEASE. A
          site-wide footer reads `Foundry v<crate version>`. Shipped in v0.5.0.
          A git SHA or build date was explicitly out of scope.
      - date: 2026-10-04
        by: docs/feature/release-version-footer/feature-delta.md
        change: >
          US-RVF-02: job WIDENED from the release to the BUILD. The footer adds
          the commit date and carries the short SHA in data-commit, baked at
          compile time from build-args, then git, then `unknown`. This lets the
          operator spot a stale or dev build that shares a version number.
          Targeted for v0.8.0.
