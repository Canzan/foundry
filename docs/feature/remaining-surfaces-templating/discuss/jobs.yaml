  US-R05: htmx-web-1   # Slice 5: attachment surfaces (upload-error, OOB row, too-large, not-found) → template
  US-R06: htmx-web-2   # Slice 6: bootstrap dashboard + claim form + invite-link page + invalid_page → base.html
