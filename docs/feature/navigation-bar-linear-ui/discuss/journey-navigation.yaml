schema_version: 1

journey:
  name: "Navigate the Foundry app via a shared Linear-style sidebar"
  goal: "From any authenticated page, always know the current location and reach any primary surface (Home, Projects, account actions) in one click."
  persona: "Devon Park — workspace member on the 'Acme' workspace"

  emotional_arc:
    start: "Slightly disoriented — navigation is ad-hoc per page today."
    middle: "Oriented and in control — a persistent rail is always present and highlights the current section."
    end: "Confident and fast — one click to any primary surface; account actions live in a fixed corner."

steps:
  - id: 1
    name: "Rail appears on an authenticated page"
    command: "GET / (dashboard) — base.html renders the shared sidebar"
    tui_mockup: |
      +-- Sidebar (authed) ----------------------------------------+
      | [A] Acme  (workspace)      |  Welcome back, Devon Park       |
      |  Home            <- active |  Your projects: ACME, WEB ...   |
      |  Projects                  |  Quick actions ...              |
      |  ......................... |                                 |
      |  [D] Devon Park / Acme  v  |                                 |
      +------------------------------------------------------------+
    shared_artifacts:
      - name: "display_name"
        source: "auth/session context -> template context (per authed handler)"
        displayed_as: "{{ display_name }}"
        consumers: ["sidebar footer account anchor", "dashboard welcome line"]
      - name: "workspace_name"
        source: "auth/session context -> template context (per authed handler)"
        displayed_as: "{{ workspace_name }}"
        consumers: ["sidebar workspace identity block", "sidebar footer account anchor", "dashboard workspace line"]
      - name: "active_section"
        source: "request handler sets the current section (home | projects)"
        displayed_as: "aria-current / active CSS class on the matching nav item"
        consumers: ["sidebar nav item highlighting on every authed page"]
    emotional_state:
      entry: "Returning, wants orientation."
      exit: "Oriented — sees where they are, brand + workspace confirm context."
    integration_checkpoint: |
      The page's template context must provide display_name, workspace_name,
      is_instance_admin, csrf, and active_section. base.html previously carried
      no nav; adding the rail to the shared layout requires these values to be
      present in EVERY authed page context.
    failure_modes:
      - "An authed page renders without display_name/workspace_name in context -> rail shows blank identity."
      - "active_section not set -> no item highlighted, user loses orientation."
    gherkin: |
      Scenario: The shared sidebar is present on authenticated pages
        Given Devon Park is signed in to the "Acme" workspace
        When Devon opens the dashboard at "/"
        Then a persistent left sidebar is shown with the workspace name "Acme"
        And the sidebar shows primary navigation items "Home" and "Projects"
        And the footer shows the signed-in name "Devon Park"

  - id: 2
    name: "Move between primary surfaces with active-state feedback"
    command: "Click 'Projects' in the rail -> navigate to a project board"
    tui_mockup: |
      +-- Sidebar (on a board) ------------------------------------+
      |  Home                      |  ACME board                     |
      |  Projects        <- active |  Backlog | In progress | Done   |
      |  ......................... |                                 |
      |  [D] Devon Park / Acme  v  |                                 |
      +------------------------------------------------------------+
    shared_artifacts:
      - name: "active_section"
        source: "request handler sets home | projects for the current route"
        displayed_as: "aria-current=\"page\" + accent-tinted active item"
        consumers: ["sidebar nav on dashboard, board, report, issue pages"]
    emotional_state:
      entry: "Wants to reach a board quickly."
      exit: "In control — the rail persisted, 'Projects' is now highlighted."
    integration_checkpoint: |
      Exactly one primary item carries the active state; it matches the route
      family. Home active for "/", Projects active for board/report/issue routes.
    failure_modes:
      - "Two items highlighted at once (ambiguous location)."
      - "Highlight lags the route (marked Home while viewing a board)."
    gherkin: |
      Scenario: The current section is highlighted in the sidebar
        Given Devon Park is signed in to the "Acme" workspace
        When Devon views a project board under "/team/acme/project/web"
        Then the "Projects" navigation item is marked as the current page
        And the "Home" navigation item is not marked as current

  - id: 3
    name: "Reach account actions from the pinned footer menu"
    command: "Open user menu -> Keyboard shortcuts / Instance admin / Sign out"
    tui_mockup: |
      +-- User menu (footer) --------------------------------------+
      |  Devon Park                                                 |
      |  Acme                                                       |
      |  ----------------------------------------------            |
      |  Keyboard shortcuts        -> /keyboard-help               |
      |  Instance admin            -> /admin/instance/workspaces   |
      |                               (only if is_instance_admin)  |
      |  ----------------------------------------------            |
      |  Sign out                  -> POST /sign-out (_csrf)       |
      +------------------------------------------------------------+
    shared_artifacts:
      - name: "csrf"
        source: "auth/session context -> template context (per authed handler)"
        displayed_as: "hidden input _csrf = {{ csrf }} in the sign-out form"
        consumers: ["sidebar footer sign-out POST form", "dashboard sign-out form (existing)"]
      - name: "is_instance_admin"
        source: "auth/session context -> template context (per authed handler)"
        displayed_as: "{% if is_instance_admin %} Instance admin item {% endif %}"
        consumers: ["sidebar user menu (Instance admin item)", "dashboard Quick actions (existing gate)"]
    emotional_state:
      entry: "Wants a predictable place for account actions."
      exit: "Confident — account controls are always in the same corner; sign-out is safe (CSRF)."
    integration_checkpoint: |
      Sign out reuses the existing POST /sign-out endpoint with hidden _csrf.
      Instance admin item is absent (not just hidden) for non-admins.
    failure_modes:
      - "Sign-out form omits the _csrf token -> POST rejected."
      - "Instance admin item shown to a non-admin -> 403 on click, confusing."
    gherkin: |
      Scenario: The user menu exposes account actions with CSRF-safe sign out
        Given Devon Park is signed in to the "Acme" workspace
        When Devon opens the user menu in the sidebar footer
        Then the menu contains "Keyboard shortcuts" linking to "/keyboard-help"
        And the menu contains a "Sign out" control that posts to "/sign-out" with a CSRF token

  - id: 4
    name: "Pre-auth and utility pages stay chrome-free"
    command: "GET /signin (and other pre-auth/util pages)"
    tui_mockup: |
      +-- Sign in (no rail) ---------------------------------------+
      |                Sign in to Foundry                          |
      |                [ email ......... ]                         |
      |                [ Sign in ]                                 |
      +------------------------------------------------------------+
    shared_artifacts: []
    emotional_state:
      entry: "Signed out — no workspace context."
      exit: "Focused — sees only the sign-in task, no nav they cannot use."
    integration_checkpoint: |
      Excluded templates do not extend the nav-bearing layout, OR the layout
      suppresses the rail when no authenticated session/workspace context exists.
      Excluded: signin, forgot, forgot_sent, bootstrap_*, invite_accept,
      invalid_page, payload_too_large, events_signin_required.
    failure_modes:
      - "Rail renders on signin -> empty identity block, broken links, user confusion."
    gherkin: |
      Scenario: Pre-auth pages do not show the sidebar
        Given a visitor is not signed in
        When the visitor opens the sign-in page at "/signin"
        Then no navigation sidebar is shown
        And only the sign-in content is visible

integration_validation:
  shared_artifact_consistency:
    - artifact: "display_name"
      must_match_across: [1, 3]
      failure_message: "Sidebar footer name must match the session's display_name used elsewhere on the page."
    - artifact: "workspace_name"
      must_match_across: [1, 3]
      failure_message: "Workspace identity block and footer must show the same workspace_name as the session."
    - artifact: "active_section"
      must_match_across: [1, 2]
      failure_message: "Highlighted nav item must match the current route family on every authed page."
    - artifact: "csrf"
      must_match_across: [3]
      failure_message: "Sign-out form must carry the session CSRF token or the POST is rejected."
    - artifact: "is_instance_admin"
      must_match_across: [3]
      failure_message: "Instance admin visibility must reuse the existing is_instance_admin gate, consistent with the dashboard."

changelog:
  - date: "2026-07-07"
    feature: "navigation-bar-linear-ui"
    change: "Initial DISCUSS journey: shared Linear-style left sidebar on authed pages; pre-auth pages excluded."
