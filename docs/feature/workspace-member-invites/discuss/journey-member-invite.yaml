schema_version: 1

journey:
  name: "Workspace Member Invites — an admin invites a teammate; the teammate joins"
  goal: "Generalize the shipped first-admin /invites/accept flow to general workspace members: a workspace admin issues a signed member invite, and the invitee (who has no account) opens the link, sets a password, and is created + joined as a member + signed in — all atomically."
  personas:
    - "Dana Reyes (dana.reyes@northwind.example) — ADMIN of the Northwind workspace, the inviter."
    - "Sam Okafor (sam.okafor@northwind.example) — the invitee; has NO Foundry account yet."

  scope:
    in_scope:
      - "Member-invite ISSUANCE by a workspace admin (is_workspace_admin gate)."
      - "Member-invite ACCEPTANCE that CREATES the user + adds a member-role membership + sets password + auto-signs-in, all in one atomic tx."
    out_of_scope:
      - "Inviting as admin role (member role only in v1)."
      - "Bulk invites."
      - "Invite revocation / resend."
      - "CLI-native issuance command (the emitted link is a web URL; web route suffices)."
      - "Multi-workspace-membership-via-invite for an email that is already a user (OD-1: refuse non-enumerably in v1)."

  brownfield_reuse:
    - "InviteToken (sign/verify) — foundry-auth, HMAC binds invite_id||expires_at. Reused verbatim."
    - "invites table with used_at/used_by single-use markers — foundry-store. Reused; member invites are just rows with role-member intent at consume time."
    - "insert_invite(id, workspace_id, invitee_email, created_by, expires_at) — reused for issuance."
    - "hash_password (argon2id) + check_password_policy (min-12) — foundry-auth. Reused verbatim."
    - "show_accept_form / submit_accept GET+POST handlers, InviteAcceptPage template, invite_refusal_page() uniform refusal — foundry-app invites_accept.rs. Reused; POST swaps the consume tx."
    - "is_workspace_admin — foundry-store, the issuance authz gate."
    - "Session layer + double-submit CSRF + resolve_active_workspace — reused for the public POST and the auto-sign-in landing."
    - "not_found() non-enumerable 404 idiom (admin_tokens.rs, /admin/instance) — reused for the non-admin issuance refusal."

  new_logic:
    - "Issuance surface: GET/POST /workspace/invites — a workspace-admin web form (is_workspace_admin-gated, CSRF, non-enumerable for non-admins)."
    - "Accept-for-member consume tx: create_member_and_consume(id, password_hash, now) — creates the user + adds a member-role membership + marks the invite used, on the SAME atomic 0-or-1 row guard as the shipped first-admin consume."

  emotional_arc:
    inviter:
      start: "Task-focus — 'I need to add Sam to Northwind.'"
      middle: "Growing confidence — low-friction form; brief suspense at send."
      end: "Relief and control — 'Sam's on the way in, no IT ticket needed.'"
    invitee:
      start: "Cautious trust — 'is this legit? I don't even have an account.'"
      middle: "Growing confidence — chooses own password; brief suspense at submit (create+join+sign-in is atomic)."
      end: "Relief and belonging — landed on Northwind as a member, a real account at last."

steps:
  - id: I1
    name: "Issuance — open the member-invite form (admin-gated)"
    command: "GET /workspace/invites"
    tui_mockup: |
      +-- Invite a member to "${workspace_name}" -----------------+
      | Email   [ sam.okafor@northwind.example_________ ]         |
      | <hidden> _csrf=${csrf_token}                              |
      |                                   [ Send invite ]         |
      +-----------------------------------------------------------+
    shared_artifacts:
      - name: "workspace_id"
        source: "SessionUser.workspace_id (signed-in admin's active workspace) — resolve_active_workspace seam, shipped"
        displayed_as: "${workspace_id}"
        consumers: ["is_workspace_admin gate", "insert_invite workspace_id", "form heading workspace name"]
      - name: "csrf_token"
        source: "csrf::generate_token (double-submit cookie, shipped)"
        displayed_as: "${csrf_token}"
        consumers: ["hidden _csrf field", "CSRF middleware on POST"]
    emotional_state:
      entry: "task-focus"
      exit: "growing confidence — the form is simple, just an email"
    integration_checkpoint: |
      GET is gated by is_workspace_admin(${workspace_id}, ${user_id}). A signed-in NON-admin OR a
      signed-out caller gets the non-enumerable 404 (not_found() idiom) — the route does not reveal it
      exists. No state mutation on GET.
    failure_modes:
      - "I-E1 Non-admin: is_workspace_admin false -> non-enumerable 404 (byte-identical to a generic 404)"
      - "I-E2 Signed-out: no session -> non-enumerable 404 (indistinguishable from I-E1)"
    gherkin: |
      Scenario: A workspace admin sees the member-invite form
        Given Dana Reyes is signed in as an admin of the "Northwind" workspace
        When Dana opens the member-invite page
        Then she sees a form to invite a member by email to "Northwind"

      Scenario: A non-admin member cannot tell the issuance surface exists
        Given Sam Okafor is signed in as a plain member of "Northwind"
        When Sam opens the member-invite page
        Then he sees a generic "not found" response
        And nothing reveals that an issuance surface exists

  - id: I2
    name: "Issuance — send the invite (create row + emit signed link)"
    command: "POST /workspace/invites  (email, _csrf)"
    tui_mockup: |
      +-- POST /workspace/invites (admin-gated, CSRF) -----------+
      | is_workspace_admin? else 404                             |
      | validate email present + shape (else inline error)      |
      | insert_invite(new id, ${workspace_id}, ${invitee_email}, |
      |   created_by=${admin_user_id}, now + 7 days)            |
      | InviteToken::new -> ${signature}                        |
      | invite_url = {public_url}/invites/accept?id=…&sig=…     |
      | email.send(${invitee_email}, invite_url)  (best-effort) |
      +----------------------------------------------------------+
      "Invite sent to sam.okafor@… — or share this link: …"
    shared_artifacts:
      - name: "invite_id"
        source: "invites.id — NEW row created by insert_invite (uuid v7)"
        displayed_as: "${invite_id}"
        consumers: ["the emitted /invites/accept link", "later create_member_and_consume WHERE id=$1"]
      - name: "invitee_email"
        source: "the email Dana typed; stored in invites.invitee_email"
        displayed_as: "${invitee_email}"
        consumers: ["email.send target", "create_member_and_consume new users.email_lower/display", "email-already-a-user check (OD-1)"]
      - name: "signature"
        source: "InviteToken::new(invite_id, expires_at, SESSION_SECRET).signature (HMAC) — reused"
        displayed_as: "${signature}"
        consumers: ["the emitted link sig param", "accept GET/POST re-verification"]
      - name: "invite_url"
        source: "format!(\"{public_url}/invites/accept?id={}&sig={}\") — mirrors bootstrap::create_invite"
        displayed_as: "${invite_url}"
        consumers: ["the 'invite sent' fragment", "the best-effort email body"]
    emotional_state:
      entry: "growing confidence"
      exit: "relief and control — the invite is out, link shown for manual paste too"
    integration_checkpoint: |
      The invite row carries workspace_id = the admin's ${workspace_id}, invitee_email, created_by =
      ${admin_user_id}, expires_at = now + 7 days. The emitted ${signature} is the one accept re-verifies.
      Email is best-effort (mirrors shipped create_invite); a send failure still shows the link.
    failure_modes:
      - "I-E3 Missing/invalid email: inline form error, NO invite created"
      - "I-E4 Missing/invalid CSRF: refused by shipped middleware, NO invite created"
      - "I-E5 Email send fails: invite still created, link shown for manual paste (best-effort)"
    gherkin: |
      Scenario: An admin sends a member invite and gets a shareable link
        Given Dana is signed in as an admin of "Northwind"
        When Dana submits "sam.okafor@northwind.example" on the member-invite form
        Then an invite to "Northwind" is created for that email
        And Dana sees a confirmation with a shareable accept link valid for 7 days

      Scenario: A blank email is corrected inline without creating an invite
        Given Dana is on the member-invite form
        When Dana submits the form with an empty email
        Then she sees an inline error asking for an email address
        And no invite is created

  - id: A1
    name: "Acceptance — arrive, verify token, render set-password form (reused)"
    command: "GET /invites/accept?id=${invite_id}&sig=${signature}"
    tui_mockup: |
      +-- Set your password to join "${workspace_name}" ----------+
      | You've been invited to join as a member.                  |
      | New password   [____________________]                     |
      | Confirm        [____________________]                     |
      | <hidden> id=${invite_id} sig=${signature} _csrf=${csrf}   |
      |                              [ Set password & join ]      |
      +-----------------------------------------------------------+
    shared_artifacts:
      - name: "invite_id"
        source: "the id query param; matches the invites row issuance created"
        displayed_as: "${invite_id}"
        consumers: ["GET query param", "hidden form field", "POST body", "create_member_and_consume"]
      - name: "signature"
        source: "the sig query param; InviteToken-bound to invite_id||expires_at — reused verify"
        displayed_as: "${signature}"
        consumers: ["GET query param", "hidden form field", "POST re-verification"]
      - name: "workspace_name"
        source: "workspaces row joined via invites.workspace_id (invite_accept_view — reused)"
        displayed_as: "${workspace_name}"
        consumers: ["set-password page heading (context, builds trust)"]
    emotional_state:
      entry: "cautious trust — 'I don't even have an account'"
      exit: "growing confidence — recognizes the workspace name"
    integration_checkpoint: |
      Identical to the shipped first-admin GET (show_accept_form, reused verbatim): verify HMAC binds
      id||expires_at, look up invites row, confirm unexpired AND unconsumed. Render form ONLY for a live
      valid invite; any failure -> uniform refusal. NO mutation on GET. Copy says "join as a member."
    failure_modes:
      - "A-E1 Expired: expires_at <= now -> uniform refusal"
      - "A-E2 Already used: used_at IS NOT NULL -> uniform refusal"
      - "A-E3 Invalid/tampered sig: HMAC mismatch -> uniform refusal"
      - "A-E4 Unknown id: no invites row -> uniform refusal (byte-identical to A-E1..3)"
    gherkin: |
      Scenario: An invitee with no account opens a live member invite and sees a set-password form
        Given Dana issued Sam a live member invite for "Northwind" 2 hours ago
        And Sam has no Foundry account yet
        When Sam opens his invite link
        Then he sees a set-password form naming the "Northwind" workspace
        And shared artifact "${invite_id}" matches the invites row issuance created

  - id: A2
    name: "Acceptance — set password / join (NEW atomic create-user + membership + consume)"
    command: "POST /invites/accept  (id, sig, password, confirm, _csrf)"
    tui_mockup: |
      +-- POST /invites/accept (server, <1s, invisible) ---------+
      | re-verify sig binds id||expires_at                       |
      | confirm-match + min-12 policy (BEFORE consume; reused)   |
      | hash_password (argon2id, reused)                         |
      | BEGIN TX  create_member_and_consume:                     |
      |   UPDATE invites SET used_at=now WHERE id=$1             |
      |     AND used_at IS NULL AND expires_at > now             |
      |     RETURNING workspace_id, invitee_email                |
      |       (0 rows -> ABORT -> uniform refusal)               |
      |   INSERT users (email from invite, ${password_hash})     |
      |       (email already a user -> ABORT -> refusal, OD-1)   |
      |   INSERT workspace_memberships(..., role='member')      |
      |   UPDATE invites SET used_by = new user_id              |
      | COMMIT                                                   |
      | establish ${session}; resolve_active_workspace           |
      +----------------------------------------------------------+
      303 See Other -> "/"
    shared_artifacts:
      - name: "password_hash"
        source: "foundry_auth::hash_password (argon2id, OWASP) — reused verbatim"
        displayed_as: "${password_hash}"
        consumers: ["NEW users row", "later verify_password at sign-in"]
      - name: "user_id"
        source: "NEW users row created inside create_member_and_consume (uuid v7)"
        displayed_as: "${user_id}"
        consumers: ["workspace_memberships.user_id", "invites.used_by", "SessionUser.user_id"]
      - name: "membership"
        source: "NEW workspace_memberships row (workspace_id, user_id, role='member') — mirrors the 'admin' insert in provision_workspace, role swapped to member"
        displayed_as: "${membership}"
        consumers: ["resolve_active_workspace", "all workspace-scoped authz"]
      - name: "invites_row_used_at"
        source: "invites.used_at / used_by — the single-use markers (shipped columns, reused)"
        displayed_as: "${invites_row}.used_at"
        consumers: ["consume guard (UPDATE ... WHERE used_at IS NULL)", "GET liveness re-render guard"]
      - name: "session"
        source: "session layer SESSION_KEY_USER_ID -> SessionUser{user_id, workspace_id} — reused"
        displayed_as: "${session}"
        consumers: ["all subsequent authenticated requests", "303 landing on /"]
    emotional_state:
      entry: "growing confidence, brief suspense at submit"
      exit: "relief — it took, I'm in and I have an account"
    integration_checkpoint: |
      The NEW create_member_and_consume tx is the only genuinely-new logic. The consume guard
      (UPDATE ... WHERE used_at IS NULL AND expires_at > now, 0-or-1 rows) is IDENTICAL to the shipped
      first-admin consume — single-use, race-safe, expiry re-checked in the tx. The create-user, the
      member-membership insert, and the consume mark are in ONE transaction: none happen without the
      others. Password + confirm validation run BEFORE the tx opens (rejected password leaves invite live).
    failure_modes:
      - "A-E5 Weak password: below min-12 -> inline error, NO consume, NO user created (reused US-03)"
      - "A-E6 Passwords don't match: confirm != new -> inline error, NO consume (reused US-03)"
      - "A-E7 Lost consume race: concurrent POST, 0 rows -> uniform refusal; user created exactly once"
      - "A-E8 Missing/invalid CSRF: refused by shipped middleware, no consume, no user, no password"
      - "A-E9 Email already a user: create-user step aborts tx -> uniform refusal; invite NOT consumed (OD-1 v1: defer multi-workspace membership)"
      - "A-E1/A-E2 Expired-or-used between GET and POST -> 0 rows -> uniform refusal"
    gherkin: |
      Scenario: Setting a password creates the member account, joins the workspace, and signs in
        Given Sam has opened his valid member invite for "Northwind"
        And Sam has no Foundry account yet
        When Sam submits a password meeting the strength policy and confirms it
        Then a new account is created for "sam.okafor@northwind.example"
        And he is added to "Northwind" as a member
        And the invite is marked used and can never be used again
        And he is signed in without a separate login step
        And shared artifact "${membership}" references the invite's workspace

      Scenario: A weak password is corrected inline without creating an account
        Given Sam has opened his valid member invite for "Northwind"
        When Sam submits a password below the strength policy
        Then he sees an inline error explaining the password requirement
        And no account is created and his invite is still live

      Scenario: An invite whose email already has an account is refused without leaking that fact
        Given Dana issued a member invite for an email that already has a Foundry account
        When that invitee opens the link and submits a valid password
        Then they see the standard "invite is no longer valid" page
        And no second account is created and the invite is not consumed

      @property
      Scenario: Concurrent accepts of one member invite create the account exactly once
        Given Sam's member invite is live
        When two accept submissions for the same invite arrive concurrently
        Then exactly one submission creates the account, joins, and signs in
        And the other receives the standard "invite is no longer valid" page
        And exactly one user and one membership are created

      @property
      Scenario: The accept POST is refused without a valid CSRF token
        Given a forged member-accept submission without a valid CSRF token
        When it reaches the accept endpoint
        Then it is refused by the request-forgery protection
        And no invite is consumed, no account is created, and no password is written

  - id: A3
    name: "Acceptance — land, signed in on the workspace as a member (reused)"
    command: "GET / (authenticated)"
    tui_mockup: |
      +-- GET / (authenticated) ------------------- Sam Okafor v -+
      | Northwind                                                 |
      | Welcome, Sam. You're a member of Northwind.               |
      | [ Projects ] [ Issues ] [ Team ]                          |
      +-----------------------------------------------------------+
    shared_artifacts:
      - name: "workspace_id"
        source: "resolve_active_workspace(user) — shipped membership seam"
        displayed_as: "${workspace_id}"
        consumers: ["SessionUser.workspace_id", "dashboard tenant scoping", "all workspace-scoped reads"]
    emotional_state:
      entry: "relief"
      exit: "belonging — 'I'm a member of Northwind, I have a real account'"
    integration_checkpoint: |
      The landed workspace_id MUST equal invites.workspace_id for the consumed invite. Sam sees ONLY that
      tenant's data through resolve_active_workspace, with member (not admin) privileges — so the
      issuance surface (/workspace/invites) returns 404 to him.
    failure_modes:
      - "User belongs to no workspace (impossible post-join — membership created in the same tx) -> fail closed"
    gherkin: |
      Scenario: A newly joined member lands on the workspace with member privileges only
        Given Sam has just set his password and joined "Northwind" via the invite
        When he is redirected after sign-in
        Then he sees the "Northwind" workspace dashboard
        And he sees no data from any other workspace
        And he cannot access the admin-only member-invite surface

integration_validation:
  shared_artifact_consistency:
    - artifact: "invite_id"
      must_match_across: ["I2", "A1", "A2"]
      failure_message: "The id issuance created differs from the id accept consumes — invite mismatch."
    - artifact: "signature"
      must_match_across: ["I2", "A1", "A2"]
      failure_message: "The sig emitted by issuance / rendered on GET differs from the sig POST re-verifies — token integrity broken."
    - artifact: "workspace_id"
      must_match_across: ["I2", "A2", "A3"]
      failure_message: "The new member joined or landed on a workspace other than invites.workspace_id — tenant isolation breach."
    - artifact: "invitee_email"
      must_match_across: ["I2", "A2"]
      failure_message: "The created user's email differs from the invite's invitee_email — wrong account created."
  uniform_refusal_invariant: |
    The user-visible acceptance refusal body MUST be byte-identical across A-E1 (expired), A-E2 (used),
    A-E3 (invalid sig), A-E4 (unknown id), AND A-E9 (email-already-a-user). A litmus must RED if any arm
    diverges. Refusals differ ONLY in internal tracing, never in the observable response or status.
  issuance_non_enumerability_invariant: |
    The issuance refusal (I-E1 non-admin, I-E2 signed-out) MUST be byte-identical to a generic 404 — the
    /workspace/invites route reveals nothing about its own existence to a non-admin.
  atomic_join_invariant: |
    create-user + member-membership insert + consume(used_at) occur in ONE transaction. Under any
    concurrency, exactly one accept succeeds, creating exactly one user and exactly one membership; all
    others see 0 rows and get the uniform refusal.

changelog:
  - date: "2026-06-15"
    feature: "workspace-member-invites"
    change: "Initial journey: generalizes the shipped first-admin invite-accept-flow to general members. New issuance surface (admin-gated /workspace/invites) + new create_member_and_consume accept tx (creates user + member membership + consumes, atomically). Reuses InviteToken, invites table, hash_password, min-12 policy, accept GET handler, uniform refusal, session + resolve_active_workspace. Sad paths I-E1..E5 (issuance) and A-E1..E9 (acceptance, incl. email-already-a-user OD-1) first-class."
