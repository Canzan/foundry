        When Mei types "zzz"
        Then the results list shows an empty state indicating nothing matched

  - id: M1
    name: "Select — j/k walk the VISIBLE cards (retires #kb-items)"
    command: "j/k -> move ${selection} over ${visible_cards} in DOM order; ring + scrollIntoView"
    tui_mockup: |
      +-- the AUTH board (what Mei SEES) ------------------------+
      | [ Todo ]           [ In Progress ]   [ Done ]            |
      | +===============+  +--------------+  +------------+      |
      | | AUTH-3 Login..|  | AUTH-1 CSRF..|  | AUTH-4 Docs|      |
      | +===============+  +--------------+  +------------+      |
      |  ^^^ RING = selected (j)                                 |
      | +---------------+                                        |
      | | AUTH-2 Sessio.|  <- j again selects THIS (next VISIBLE)|
      | +---------------+                                        |
      +----------------------------------------------------------+
        order = what she sees (column-grouped, DESC-within-column)
        NOT #kb-items' flat ASC order -> the carrier is RETIRED (ODD-1)
        below the fold -> scrollIntoView; k at the top -> stays (no wrap)
    shared_artifacts:
      - name: "selection"
        source: "CLIENT-ONLY, EPHEMERAL (BR-5) — never persisted, never sent to the server, RESETS ON NAVIGATION. Points at one ${visible_cards} element. Survival across an htmx swap (by issue-key vs index vs reset) -> ODD-5."
        displayed_as: "${selection}"
        consumers: ["the ring highlight + scrollIntoView (M1)", "Enter (M2) — opens the selected card", "Esc (K4) — must NOT clear it"]
      - name: "visible_cards"
        source: "article.issue-card in DOM order (issue_card.html:1) on the board, and li.search-result on the results list (ODD-6). NOT the hidden #kb-items carrier (board.html:12), which this model RETIRES (ODD-1)."
        displayed_as: "${visible_cards}"
        consumers: ["j/k selection order", "Enter's target resolution"]
    emotional_state:
      entry: "maintainer: 'which issue am I on?'"
      exit: "maintainer: 'I can see exactly where I am, and it's where my eyes are'"
    integration_checkpoint: |
      SELECTION ORDER MUST EQUAL VISIBLE ORDER — the order Mei sees. This RETIRES #kb-items and DELETES it with
      its builder (projects.rs:881-891), view-model field (views.rs:256), unit tests (:1039-1110), and TWO
      GREEN acceptance assertions (us_12_keyboard_nav.rs:334-360, feature_b_web_tier.rs:568-572) per the AGENTS.md
      dead-code policy (ODD-1, R1). A litmus must RED if selection order diverges from visible order.
      A11Y DEBT, NAMED: a ring is NOT native focus (D-4 rejected roving tabindex), so NOTHING announces the
      selection to a screen reader FOR FREE. NFR-7 refuses to let that be silence; ODD-7 forces DESIGN to answer
      (aria-activedescendant or equivalent) rather than inherit it (R3).
    failure_modes:
      - "M-E2 k at the first card -> stays; bounded, no wrap (FR-8)."
      - "M-E3 j on an empty board (board.html:9 empty state) -> nothing; no error (FR-8)."
      - "M-E4 Stale ring after Hiroshi drags the selected card -> NFR-8, ODD-5, R4."
      - "M-E5 Selection lost/corrupted across an htmx swap -> handlers survive via delegation (FR-10, NFR-6); selection survival is ODD-5."
      - "M-E6 Screen reader never announces the selection -> NFR-7, ODD-7, R3."
    gherkin: |
      Scenario: Next and previous walk the cards in the order Mei sees them
        Given Mei is signed in and viewing the AUTH board showing issues AUTH-3, AUTH-2 and AUTH-1
        When Mei presses "j" and then "k"
        Then the selection moves to the second visible card and back to the first
        And the selection order matches the order the cards appear on screen

      Scenario: A selection below the fold scrolls into view
        Given Mei is viewing the AUTH board with more cards than fit on screen
        When Mei presses "j" repeatedly until the selection passes the bottom of the viewport
        Then the selected card is scrolled into view and its highlight is visible

      Scenario: Dragging a card with the mouse leaves selection coherent
        Given Mei has a card selected on the AUTH board
        When Hiroshi drags that card into another column with the mouse
        Then the drag completes as it does today
        And no stale highlight is left behind

  - id: M2
    name: "Open — Enter opens the selected card (the card's own hx-get)"
    command: "Enter -> activate ${selection}'s hx-get={edit_url} -> #modal-root"
    tui_mockup: |
      +-- Enter -> the SELECTED card's own hx-get ---------------+
