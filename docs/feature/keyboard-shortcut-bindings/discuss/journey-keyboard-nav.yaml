integration_validation:
  shared_artifact_consistency:
    - artifact: "shortcut_set"
      must_match_across: ["K1", "K3"]
      failure_message: "The bound keys differ from the help overlay's list — the product advertises a shortcut it does not honour, which is the exact bug this feature exists to fix (BR-1)."
    - artifact: "guard_verdict"
      must_match_across: ["K2", "K3", "K4", "A1", "A2", "M1", "M2"]
      failure_message: "A shortcut bypassed the guard — it fires while the user is typing or under a Cmd/Ctrl/Alt chord, making text entry impossible (worse than shipping nothing) (BR-2, NFR-2)."
    - artifact: "selection"
      must_match_across: ["M1", "M2", "K4"]
      failure_message: "The card the ring shows differs from the card Enter opens, or Esc silently cleared it — the user acts on the wrong issue or loses their place (FR-9, BR-5)."
    - artifact: "visible_cards"
      must_match_across: ["M1", "M2"]
      failure_message: "Selection order diverges from the order the user sees — the ring jumps unpredictably because it is walking the retired #kb-items order instead of the visible cards (ODD-1, FR-8)."
    - artifact: "modal_mount"
      must_match_across: ["K3", "A1", "M2"]
      failure_message: "A layer has nowhere to render — #modal-root exists only on the board (board.html:13), so the global ? overlay has no mount on other pages (ODD-3, R5)."
  browser_observable_invariant: |
    EVERY acceptance scenario in this feature asserts key-pressed -> user-observable outcome in a real
    browser/DOM, and MUST FAIL on unmodified main. The shipped port-to-port suite (us_12_keyboard_nav.rs) already
    proves the server contracts and is GREEN TODAY WHILE THE FEATURE IS ABSENT. A scenario that passes unchanged
    on main tests the server contract, not this feature, and is rejected on sight (NFR-1).
  typing_never_captured_invariant: |
    No shortcut fires while the user is typing into a text-entry context, and no shortcut fires with
    Ctrl/Cmd/Alt held. Typing "cjk/?" into any field yields exactly "cjk/?"; Cmd+C copies. A regression makes the
    product UNUSABLE (the user cannot type the letter c into a title) — strictly worse than shipping nothing. A
    dedicated @property litmus must RED on regression (NFR-2, NFR-3, R2, R6).
  no_js_intact_invariant: |
    Pure progressive enhancement. With scripting disabled the app behaves exactly as today: GET …/issues/new
    without HX-Request still returns the full-page fallback (keyboard.rs:96-104), the "New issue" button still
    works (board.html:6), and /keyboard-help is still reachable as a full page (sidebar.html:13). No shortcut is
    the ONLY path to any action (BR-6, NFR-4, R7).
  zero_server_delta_invariant: |
    This feature adds NO route, NO endpoint, NO migration. All three routes are shipped and routed
    (lib.rs:491-498, :536). The only server-side changes are REMOVALS: the retired #kb-items carrier + builder +
    view-model field + unit tests + two acceptance assertions (ODD-1), and the correction of keyboard.rs's stale
    "alpine.js" doc comment if DESIGN picks vanilla (ODD-2, R9).
  handlers_survive_swaps_invariant: |
    Bindings are document-delegated (the board-dnd.js:67 idiom), so an htmx swap that replaces #modal-root or
    re-renders cards needs no re-wiring: after filing an issue via c, j/k/Enter still work with no page reload
    (FR-10, NFR-6). Selection SURVIVAL across a swap (as opposed to handler survival) is ODD-5.
  selection_a11y_invariant: |
    The ring is NOT native focus (D-4 rejected roving tabindex). It must meet WCAG 2.1 AA contrast, must not rely
    on colour alone, and selection changes MUST be conveyed to assistive tech by an explicit mechanism
    (aria-activedescendant or equivalent) — DESIGN must answer this explicitly rather than inherit silence
    (NFR-7, ODD-7, R3).
  drag_coexistence_invariant: |
    The shipped drag-and-drop (board-dnd.js) keeps working unchanged; a drag and the selection never corrupt each
    other (no stale ring, no dangling index). Every existing drag scenario passes unchanged (NFR-8, R4).

changelog:
  - date: "2026-07-15"
    feature: "keyboard-shortcut-bindings"
    change: "Initial journey: bind the seven shortcuts the help overlay already advertises (SHORTCUTS, keyboard.rs:48-56) in the browser — the client layer that was never written (verified: ZERO keydown handlers in app code; the only match is inside the vendored alpine.min.js). A document-delegated dispatch layer (the board-dnd.js:67 idiom) with a guard chain evaluated BEFORE dispatch (text-input + modifier — the highest-risk piece, NFR-2); ? renders the shipped public /keyboard-help fragment as an OVERLAY; Esc closes the topmost layer selection-intact; c opens the shipped new-issue modal via the htmx path (no-JS fallback untouched); / focuses search without typing the slash; j/k walk VISIBLE cards in DOM order with a ring + scrollIntoView; Enter opens the selected card via its own shipped hx-get. ZERO new routes, ZERO migrations. KEY TENSION: the shipped hidden #kb-items carrier (board.html:12, ASC-by-number, aria-hidden, asserted green at us_12_keyboard_nav.rs:334-360) CONTRADICTS the locked visible-DOM-order selection model (D-4) and is RETIRED — deliberately deleting a passing test (ODD-1, R1). No walking skeleton (D-8) — brownfield; the server contracts are shipped and routed."
