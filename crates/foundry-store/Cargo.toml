[package]
name = "foundry-store"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry persistence adapter (sqlx + Postgres)"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Exposes test-only seams (e.g. `run_migrations_from_dir` migration
# delay knob used by the US-04 advisory-lock-race acceptance scenario).
# foundry-acceptance enables this through its `foundry-store` dep.
test-support = []

[dependencies]
foundry-core = { path = "../foundry-core" }

sqlx = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
# Integration tests spin a real Postgres (the probe's column check uses
# information_schema + current_schema(), which can't be faked). `tokio` is
# already a runtime dep with the `full` feature set (incl. the test macros).
testcontainers-modules = { workspace = true }
