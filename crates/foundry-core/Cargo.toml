[package]
name = "foundry-core"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry domain types (no I/O)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
secrecy = { workspace = true }

# Markdown rendering (US-10). Both crates are pure CPU + allocator —
# no I/O. foundry-core stays I/O-free.
pulldown-cmark = { workspace = true }
ammonia = { workspace = true }

[dev-dependencies]
# Property tests for `slugify` (instance-admin-project-rename 02-01):
# fixed-point + URL-safe-charset invariants. Same pin as foundry-auth.
proptest = "1"
