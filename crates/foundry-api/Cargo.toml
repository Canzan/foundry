[package]
name = "foundry-api"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry JSON API driving adapter (/api/v1) — RED scaffold (DISTILL)"
publish = false

# SCAFFOLD: true
# RED-ready scaffold created by DISTILL (Mandate 7) for Feature A
# "Programmatic Foundry" (US-W05a/b/c, US-W06). Per DESIGN ADR-W01 this is the
# JSON driving-adapter crate compiled INTO the one foundry binary, a peer of
# foundry-app. It depends on foundry-services (the shared seam) and
# foundry-auth (the MachineToken verify primitive) — NEVER on foundry-store
# directly (the cargo-deny boundary rule, US-W06). DELIVER fills in the
# handlers, the token_auth extractor, the IntoResponse error mapping, and the
# `routes(state)` sub-router that foundry-app's build_router merges in.
#
# This crate is NOT yet a dependency of foundry-app or the foundry binary, so
# adding it as a workspace member compiles independently and does not perturb
# the existing green acceptance suite. DELIVER adds the foundry-app ->
# foundry-api composition dependency and the AppState machine_token_verifier
# field when it wires the /api/v1 routes in (see distill/step-skeletons.md
# "What DELIVER must wire").

[lib]
path = "src/lib.rs"

[dependencies]
foundry-services = { path = "../foundry-services" }
foundry-store = { path = "../foundry-store" }
foundry-auth = { path = "../foundry-auth" }
axum = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The token_auth unit tests mint real EdDSA JWTs against the fixed test
# keypair to exercise each 401 crypto branch (missing/malformed/bad-sig/
# wrong-alg/alg:none/expired) port-to-port through `verify_bearer`.
foundry-auth = { path = "../foundry-auth", features = ["test-support"] }
jsonwebtoken = { workspace = true }
time = { workspace = true }
secrecy = { workspace = true }
base64 = { workspace = true }
