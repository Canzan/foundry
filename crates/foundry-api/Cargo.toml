[package]
name = "foundry-api"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry JSON API driving adapter (/api/v1)"
publish = false

# Per DESIGN ADR-W01 this is the JSON driving-adapter crate compiled INTO the
# one foundry binary, a peer of foundry-app. It depends on foundry-services (the
# shared seam, via the `Services` handle) and foundry-auth (the MachineToken
# verify primitive) — and NEVER on foundry-store directly. The `Services` handle
# owns the only `Arc<Store>`; this crate never names `foundry_store::Store`,
# which is the structural fact the `cargo-deny` `foundry-api ⊀ foundry-store`
# ban enforces (US-W06 boundary guard, LAYER 2).

[lib]
path = "src/lib.rs"

[dependencies]
foundry-services = { path = "../foundry-services" }
foundry-auth = { path = "../foundry-auth" }
axum = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The token_auth unit tests mint real EdDSA JWTs against the fixed test
# keypair to exercise each 401 crypto branch (missing/malformed/bad-sig/
# wrong-alg/alg:none/expired) port-to-port through `verify_bearer`.
foundry-auth = { path = "../foundry-auth", features = ["test-support"] }
jsonwebtoken = { workspace = true }
time = { workspace = true }
secrecy = { workspace = true }
base64 = { workspace = true }
