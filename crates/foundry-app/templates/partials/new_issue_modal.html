<div class="modal" role="dialog" aria-modal="true" data-modal="new-issue">
  <div class="modal-dialog">
    <header class="modal-header"><h2>New issue in {{ project_name }}</h2></header>
    <form method="post" action="{{ action }}" hx-post="{{ action }}" hx-target="#modal-root" hx-swap="innerHTML">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>Title <input type="text" name="title" required autofocus></label>
      <label>Description <textarea name="description">{{ description }}</textarea></label>
      {# form-error-display-contract ADR-001 — the opt-in slot form-errors.js
         routes a rejected 4xx fragment into, so the reason shows inside the open
         dialog instead of being discarded by htmx. Empty on the 2xx/OOB success
         path (that flow is untouched). #}
      <div data-error-slot></div>
      <button type="submit">Create</button>
    </form>
  </div>
</div>
