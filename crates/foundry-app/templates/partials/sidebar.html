<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__monogram" aria-hidden="true">{{ nav.monogram() }}</span>
    <span class="sidebar__workspace">{{ nav.workspace_name }}</span>
  </div>
  <nav class="sidebar__nav" aria-label="Primary">
    <a class="sidebar__item{% if nav.is_home() %} sidebar__item--active{% endif %}" href="/"{% if nav.is_home() %} aria-current="page"{% endif %}>Home</a>
    <a class="sidebar__item{% if nav.is_board() %} sidebar__item--active{% endif %}" href="{{ nav.board_href }}"{% if nav.is_board() %} aria-current="page"{% endif %}>Board</a>
  </nav>
  <div class="sidebar__user">
    <span class="sidebar__identity">{{ nav.display_name }}</span>
    <a class="sidebar__item" href="/keyboard-help">Keyboard shortcuts</a>
    {% if nav.is_instance_admin %}<a class="sidebar__item" href="/admin/instance/workspaces">Instance admin</a>{% endif %}
    <form method="post" action="/sign-out"><input type="hidden" name="_csrf" value="{{ nav.csrf }}"><button type="submit">Sign out</button></form>
  </div>
</aside>
