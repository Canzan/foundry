<div class="modal" role="dialog" aria-modal="true" data-modal="edit-issue">
  <div class="modal-dialog">
    <header class="modal-header"><h2>Edit {{ key }}</h2> <a class="full-page-link" href="{{ detail_url }}">Open full page</a></header>
    <form method="post" action="{{ action }}" hx-post="{{ action }}" hx-target="#modal-root" hx-swap="innerHTML">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>Title <input type="text" name="title" value="{{ title }}" required autofocus></label>
      <label>Description <textarea name="description">{{ description }}</textarea></label>
      <label>Status
        <select name="state">
          <option value="backlog"{% if selected_state == "backlog" %} selected{% endif %}>Backlog</option>
          <option value="todo"{% if selected_state == "todo" %} selected{% endif %}>Todo</option>
          <option value="in_progress"{% if selected_state == "in_progress" %} selected{% endif %}>In-Progress</option>
          <option value="done"{% if selected_state == "done" %} selected{% endif %}>Done</option>
        </select>
      </label>
      <button type="submit">Save</button>
    </form>
  </div>
</div>
