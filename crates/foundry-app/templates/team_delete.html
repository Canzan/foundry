{% extends "app_shell.html" %}
{% block title %}{{ question }}{% endblock %}
{% block app_content %}
<main class="team-delete">
  <h1>{{ question }}</h1>
  <p>{{ member_line }}</p>
  {% if let Some(line) = default_line %}<p>{{ line }}</p>{% endif %}
  {% if let Some(line) = token_line %}<p>{{ line }}</p>{% endif %}
  <form method="post" action="/team/{{ team_slug }}/delete">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <button type="submit">Delete team</button>
  </form>
  <p><a href="/team/{{ team_slug }}/members">Cancel</a></p>
</main>
{% endblock %}
