{% extends "app_shell.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block app_content %}
<main class="project-delete">
  <h1>{{ heading }}</h1>
  <p>{{ count_line }}</p>
  <p>{{ nothing_erased_line }}</p>
  <form method="post" action="/team/{{ team_slug }}/project/{{ project_slug }}/delete">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <button type="submit">Delete project</button>
  </form>
  <p><a href="/team/{{ team_slug }}/members">Cancel</a></p>
</main>
{% endblock %}
