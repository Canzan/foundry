{% extends "app_shell.html" %}
{% block title %}Disconnect {{ kind }}{% endblock %}
{% block app_content %}
<h1>Disconnect {{ kind }}</h1>
<p data-disconnect-question>{{ question }}</p>
<form method="post" action="{{ disconnect_path }}">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <p>
    <button type="submit" class="danger">Disconnect {{ kind }}</button>
    <a href="{{ workspace_path }}">Cancel</a>
  </p>
</form>
{% endblock %}
