{% extends "app_shell.html" %}
{% block title %}Replace the secrets key?{% endblock %}
{% block app_content %}
<main data-secrets-key-replace>
  <h1>Replace the secrets key</h1>
  <p data-secrets-key-replace-line>{{ line }}</p>
  <form method="post" action="{{ replace_door }}">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <button type="submit">{{ control }}</button>
  </form>
</main>
{% endblock %}
