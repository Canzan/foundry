{% extends "app_shell.html" %}
{% block title %}Start over with a new secrets key?{% endblock %}
{% block app_content %}
<main data-secrets-key-start-over>
  <h1>Start over with a new secrets key</h1>
  <p data-secrets-key-start-over-line>{{ line }}</p>
  <form method="post" action="{{ start_over_door }}">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <p data-start-over-asks>{{ asks }}</p>
    <label>{{ confirmation }} <input type="text" name="confirmation" value="" autocomplete="off"></label>
    <button type="submit">{{ control }}</button>
  </form>
</main>
{% endblock %}
