[package]
name = "foundry-app"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry HTTP application (axum binary + composition root)"
publish = false

[[bin]]
name = "foundry"
path = "src/main.rs"

[lib]
name = "foundry_app"
path = "src/lib.rs"

[features]
default = []
# Propagates to foundry-store so its test-only seams
# (`run_migrations_from_dir` slow-migration delay knob, etc.) are
# reachable through AppState's optional test-migrations-dir field.
test-support = ["foundry-store/test-support"]

[dependencies]
foundry-core = { path = "../foundry-core" }
foundry-store = { path = "../foundry-store" }
foundry-auth = { path = "../foundry-auth" }
foundry-services = { path = "../foundry-services" }
foundry-api = { path = "../foundry-api" }
foundry-realtime = { path = "../foundry-realtime" }

axum = { workspace = true, features = ["multipart"] }
# Template engine (ADR-B01 / design/template-engine.md). `askama` is the
# workspace-blessed pin (Cargo.toml:38); `askama_axum` provides the
# `IntoResponse` integration so a handler can return a `#[derive(Template)]`
# struct directly. Both MIT/Apache-2.0. Wired here (step 01-01) so step 01-02
# can move the `format!` handlers onto templates; no handler uses it yet.
askama = { workspace = true }
askama_axum = { version = "0.4" }
secrecy = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
# `set-header` is enabled here (additively, via cargo feature unification) so
# the `/static` ServeDir route can attach the long-lived immutable
# Cache-Control header (US-B02). The workspace base feature set
# (trace/compression-gzip/fs/limit/request-id/util) is unchanged.
tower-http = { workspace = true, features = ["set-header"] }

tower-sessions = { workspace = true }
tower-sessions-sqlx-store = { workspace = true }

sqlx = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
urlencoding = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

dotenvy = { workspace = true }
uuid = { workspace = true }
lettre = { workspace = true }
# notification-delivery-providers US-04 (ADR-001/006) — the webhook channel POSTs
# the rendered JSON notification over HTTP via reqwest (already the workspace HTTP
# client), and signs the body with HMAC-SHA256 (`hmac` over `sha2`, both workspace
# pins) when a `WEBHOOK_SIGNING_SECRET` is configured. No new HTTP client, no new
# crate — reqwest 0.12 + hmac 0.12 + sha2 0.10 are all already blessed.
reqwest = { workspace = true }
hmac = { workspace = true }

bytes = "1"
futures = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
# per-workspace-backup (ADR-002 / OD-PWB-3) — the per-workspace EXPORT archive is
# a single tar file (manifest.json + tables/<table>.jsonl), written atomically via
# `<out>.partial` → fsync → rename. `tar` (MIT/Apache-2.0, mature) is the archive
# container writer; it is an external dependency, NOT a new workspace crate. Used
# only by `admin_cli.rs::run_export_workspace`.
tar = "0.4"

[dev-dependencies]
# Self-reference to activate `test-support` for THIS crate's own tests
# and benches. foundry-app's integration tests (e.g. tests/csrf_middleware.rs)
# and the test build of src/main.rs construct AppState with fields gated
# behind `test-support`; without this, `cargo test -p foundry-app` fails to
# compile and the crate only built under `cargo test --workspace` because
# foundry-acceptance transitively enabled the feature via unification. This
# is the documented cargo idiom for "feature needed only in tests".
foundry-app = { path = ".", features = ["test-support"] }
foundry-realtime = { path = "../foundry-realtime" }
# Property-based testing for the rate-bucket eviction invariants (step 05-01,
# ADR-005). proptest 1 is ALREADY in the workspace lockfile (foundry-auth
# dev-dep) — this adds NO new crate to Cargo.lock, only activates the existing
# version for foundry-app's own tests.
proptest = "1"

# Slice 6 (ADR-010 / NFR-PERF-05) — middleware overhead microbench.
# `harness = false` because the bench is hand-rolled (no criterion
# dep per task brief: "NO new crate dependencies"). Run via
# `cargo bench -p foundry-app --bench middleware_overhead`.
[[bench]]
name = "middleware_overhead"
path = "benches/middleware_overhead.rs"
harness = false
