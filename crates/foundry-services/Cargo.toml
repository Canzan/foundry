[package]
name = "foundry-services"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry shared application-service seam (use-cases shared by the HTML and JSON adapters) — RED scaffold (DISTILL)"
publish = false

# SCAFFOLD: true
# This crate is a RED-ready scaffold created by DISTILL (Mandate 7) for
# Feature A "Programmatic Foundry" (US-W05a/b/c). Per DESIGN ADR-W04/W07 it is
# the single home for the use-case orchestration both foundry-app (HTML) and
# foundry-api (JSON) call. DELIVER replaces the panic! bodies with the
# extracted orchestration (authz -> validate -> sanitize -> store-write ->
# outbox) lifted out of the foundry-app handlers, returning neutral domain
# results. The crate is NOT yet a dependency of any other crate, so adding it
# as a workspace member does not perturb the existing green acceptance suite.

[lib]
path = "src/lib.rs"

[dependencies]
foundry-core = { path = "../foundry-core" }
foundry-store = { path = "../foundry-store" }
foundry-auth = { path = "../foundry-auth" }
uuid = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
# The board read use-case orchestrates the real Postgres store (authz +
# fetch), so its tests spin a real Postgres (@real-io, single-example —
# no domain invariant warrants proptest here).
tokio = { workspace = true }
sqlx = { workspace = true }
testcontainers-modules = { workspace = true }
