[package]
name = "foundry-services"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry shared application-service seam (use-cases shared by the HTML and JSON adapters)"
publish = false

# Per DESIGN ADR-W04/W07 this crate is the single home for the use-case
# orchestration both foundry-app (HTML) and foundry-api (JSON) call. It owns the
# `Services` handle wrapping the shared `Arc<Store>`; the adapters hold
# `Services` and never name `foundry_store::Store` directly (boundary-guard.md
# LAYER 2 / the `foundry-api ⊀ foundry-store` cargo-deny ban).

[lib]
path = "src/lib.rs"

[dependencies]
foundry-core = { path = "../foundry-core" }
foundry-store = { path = "../foundry-store" }
foundry-auth = { path = "../foundry-auth" }
uuid = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
# The board read use-case orchestrates the real Postgres store (authz +
# fetch), so its tests spin a real Postgres (@real-io, single-example —
# no domain invariant warrants proptest here).
tokio = { workspace = true }
sqlx = { workspace = true }
testcontainers-modules = { workspace = true }
