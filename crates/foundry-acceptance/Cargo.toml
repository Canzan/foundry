[package]
name = "foundry-acceptance"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry cross-crate acceptance suite (cucumber-rs)"
publish = false

[lib]
path = "src/lib.rs"

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
harness = false

[dependencies]
foundry-core = { path = "../foundry-core" }
foundry-store = { path = "../foundry-store", features = ["test-support"] }
foundry-auth = { path = "../foundry-auth", features = ["test-support"] }
foundry-app   = { path = "../foundry-app", features = ["test-support"] }
foundry-realtime = { path = "../foundry-realtime" }

cucumber = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# US-02 round-robin proxy is an axum binary embedded in the acceptance
# crate so we can route reqwest traffic across N foundry-app replicas
# without taking a dep on `caddy` or `hyper-reverse-proxy`. ~250 LoC,
# zero new transitive deps beyond what foundry-app already pulls in.
axum = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
# keyboard-shortcut-bindings ADR-007 — drives a REAL browser against
# InProcHarness::base_url() in the @needs-browser lane (support/browser_harness.rs).
# TLS-free: chromedriver is plain HTTP on 127.0.0.1, so browser_harness supplies a
# bare hyper-util HttpConnector rather than pulling a second TLS stack in beside
# reqwest's (which makes rustls' CryptoProvider ambiguous process-wide).
fantoccini = { workspace = true }
hyper-util = { workspace = true }
assert_cmd = { workspace = true }
serde_yaml_ng = { workspace = true }

secrecy = { workspace = true }
time = { workspace = true }
# US-W05b — mint the alg-confusion (HS256) attack token in the wrong-alg Given.
jsonwebtoken = { workspace = true }
rand = { workspace = true }
once_cell = { workspace = true }
sha2 = { workspace = true }
# notification-delivery-providers US-04 — independently recompute the webhook
# HMAC-SHA256 signature in the security scenario (an external oracle, NOT the
# production signer recomputed), asserting the header is derived from the secret.
hmac = { workspace = true }
urlencoding = { workspace = true }
# US-04 — per-scenario temp dirs for staging runtime migrations.
tempfile = { workspace = true }
# per-workspace-backup (US-PWB-01) — read the exported tar archive offline so the
# walking-skeleton Then steps verify it is well-formed (manifest + 10 table
# entries), not merely that a file exists. Same crate the export writer uses.
tar = "0.4"

[dev-dependencies]
