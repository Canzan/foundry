[package]
name = "foundry-auth"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundry authentication primitives (HMAC tokens, sessions)"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Exposes a FIXED test Ed25519 keypair + verifier/signer constructors so
# the acceptance harness can mint+verify real machine tokens (02-03/W05c),
# mirroring the fixed test SESSION_SECRET. Never enabled in release builds.
test-support = []

[dependencies]
foundry-core = { path = "../foundry-core" }

argon2 = { workspace = true }
password-hash = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
proptest = "1"
