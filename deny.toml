# cargo-deny configuration for Foundry.
# Run with: `cargo deny check`
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Each ignore MUST have a comment justifying why we accept the risk and
# pointing at the upstream tracking issue. Revisit on every dep bump.
ignore = [
    # tokio-tar: pulled in transitively by testcontainers (dev/test
    # only, never reaches the production foundry binary). The CVE is
    # about a malicious tar smuggling content past the reader, which
    # would require us to extract attacker-controlled tarballs in
    # tests — we don't. No safe upgrade is published yet; tracked
    # upstream at testcontainers-rs.
    { id = "RUSTSEC-2025-0111", reason = "transitive dev-only via testcontainers; no safe upgrade upstream" },
    # fxhash: unmaintained; pulled in via scraper -> selectors. Test
    # crate only (foundry-acceptance scrapes rendered HTML). Migration
    # path is the scraper crate switching to rustc-hash; tracked
    # upstream at scraper.
    { id = "RUSTSEC-2025-0057", reason = "transitive dev-only via scraper; awaiting upstream migration to rustc-hash" },
    # rustls-pemfile: archived; pulled in via bollard -> testcontainers.
    # Dev/test only. Migration path is bollard depending directly on
    # rustls-pki-types::PemObject; tracked upstream at bollard-rs.
    { id = "RUSTSEC-2025-0134", reason = "transitive dev-only via bollard/testcontainers; awaiting upstream migration to rustls-pki-types" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    # Our own crates declare the SPDX-correct form.
    "AGPL-3.0-only",
    # CDLA-Permissive-2.0: webpki-roots. Permissive, AGPL-compatible.
    "CDLA-Permissive-2.0",
    # 0BSD: quoted_printable (transitive via lettre). Zero-clause BSD;
    # universally permissive.
    "0BSD",
    # BlueOak-1.0.0: synthez (transitive via cucumber). FSF-approved
    # permissive license, AGPL-compatible.
    "BlueOak-1.0.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# Workspace path dependencies use `version = "*"` by convention; that
# is not a real wildcard, it's a path dep. Let cargo-deny see them as
# such.
allow-wildcard-paths = true

# US-W06 boundary guard — LAYER 2 (dependency direction as a Cargo-graph
# fact; boundary-guard.md / architecture.md "Dependency direction after
# Feature A"). The crate split (ADR-W01) upgraded these invariants from an
# AST convention to a `cargo-deny` ban. On a violation cargo-deny NAMES the
# forbidden crate + the wrapper that pulled it in.
#
# The mechanism: deny a crate outright, then `wrappers` lists the ONLY crates
# permitted to depend on it. A dependency edge from any crate NOT in the
# wrapper list is a hard error.
#
# Rule 1 — the JSON adapter must reach persistence ONLY through the shared
# `foundry-services` seam, NEVER `foundry-store` directly. `foundry-api` is
# deliberately ABSENT from the wrapper list, so a `foundry-api -> foundry-store`
# edge (e.g. re-adding `foundry-store` to crates/foundry-api/Cargo.toml) fails
# the build, naming `foundry-store` as forbidden. The wrappers are the crates
# that legitimately depend on `foundry-store` today: the shared seam, the
# composition root + binary (foundry-app, which still hosts the HTML handlers
# until Feature B extracts foundry-web), and the acceptance harness.
# (foundry-web's extraction in Feature B will REMOVE foundry-app from this list,
# tightening the rule to adapters-go-through-services everywhere.)
[[bans.deny]]
name = "foundry-store"
wrappers = ["foundry-services", "foundry-app", "foundry-acceptance"]

# Rule 2 — no reversed edge: the shared seam must not depend on the JSON
# driving adapter (the acyclic shape that ruled out folding services into the
# adapters, ADR-W07). `foundry-services` is ABSENT from the wrapper list, so a
# `foundry-services -> foundry-api` edge fails the build, naming `foundry-api`
# as forbidden. (`foundry-services -> foundry-app` is already impossible:
# foundry-app depends on foundry-services, so cargo itself rejects the cycle —
# no ban needed. foundry-app is the binary root crate and cannot be banned.)
[[bans.deny]]
name = "foundry-api"
wrappers = ["foundry-app"]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
