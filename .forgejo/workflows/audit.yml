# Dependency audit (Forgejo Actions) — RustSec advisory scan.
#
# Complements ci.yml rather than duplicating it. ci.yml already runs
# `cargo deny check` on every push/PR, so this workflow deliberately
# carries only the `cargo audit` job that ci.yml lacks, plus a weekly
# cron so newly-published advisories surface even when no dependency
# changed. There is no GitHub mirror of this workflow: the upstream
# rustsec/audit-check action reports through the GitHub Checks API,
# which Forgejo does not implement, so `cargo audit` is invoked
# directly here.
#
# Conventions follow ci.yml: `runs-on: docker` with a pinned
# rust:1.85-slim container rather than a toolchain action.

name: audit

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.forgejo/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.forgejo/workflows/audit.yml'
  schedule:
    # Weekly full scan even without dep changes. Monday 08:00 UTC avoids
    # the Sunday maintenance window.
    - cron: '0 8 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: docker
    container:
      image: rust:1.85-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit
