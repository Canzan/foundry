# Build the foundry image and push it to zot (Forgejo Actions).
#
# Builds the repo-root Dockerfile, which cross-compiles `-p foundry-app
# --bin foundry` and ships it on distroless. Publishes three tags to
# zot.${ZOT_DOMAIN}/foundry: the short git SHA, the release tag on v*,
# and a moving branch tag (`main`) so a deploy manifest can pin a stable
# ref and re-pull each build via imagePullPolicy: Always.
#
# Requires the repo Actions secret ZOT_PUSH_PASSWORD and the variable
# ZOT_DOMAIN.
#
# NOTE: deploy/k8s/foundry-deployment.yaml currently pins
# ghcr.io/foundry-project/foundry:latest. Point it at
# zot.${ZOT_DOMAIN}/foundry:main to consume the images this pipeline
# pushes.

name: build-and-publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  ZOT_DOMAIN: ${{ vars.ZOT_DOMAIN }}
  IMAGE_NAME: foundry

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The builder stage pins --platform=$BUILDPLATFORM and cross-compiles,
      # so the Rust compile is never emulated. QEMU is still needed for the
      # distroless runtime stage on a cross-arch target, where it only has to
      # copy the pre-built binary.
      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to zot
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ZOT_DOMAIN }}
          username: admin
          password: ${{ secrets.ZOT_PUSH_PASSWORD }}

      - name: Compute tags
        id: tags
        run: |
          set -e
          short_sha="${GITHUB_SHA::12}"
          {
            echo "sha=${short_sha}"
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "release=${GITHUB_REF#refs/tags/}"
            else
              echo "release="
            fi
            if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
              echo "moving=${GITHUB_REF#refs/heads/}"
            else
              echo "moving="
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # arm64-only by default matches the Pi 5 cluster; override with the
          # BUILD_PLATFORMS variable (e.g. linux/amd64,linux/arm64).
          platforms: ${{ vars.BUILD_PLATFORMS || 'linux/arm64' }}
          provenance: false
          # zot rejects buildx's default Docker-schema2 manifest; force OCI
          # media types on both the image and the registry cache.
          outputs: type=image,oci-mediatypes=true,push=true
          tags: |
            ${{ env.ZOT_DOMAIN }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.release && format('{0}/{1}:{2}', env.ZOT_DOMAIN, env.IMAGE_NAME, steps.tags.outputs.release) || '' }}
            ${{ steps.tags.outputs.moving && format('{0}/{1}:{2}', env.ZOT_DOMAIN, env.IMAGE_NAME, steps.tags.outputs.moving) || '' }}
          cache-from: type=registry,ref=${{ env.ZOT_DOMAIN }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ZOT_DOMAIN }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
