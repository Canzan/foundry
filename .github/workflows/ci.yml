# Foundry CI — runs on every push to main and every PR.
#
# SINGLE SOURCE OF TRUTH: this workflow runs exactly ONE command —
# `cargo xtask ci` — the same gate a developer runs locally before pushing
# (see AGENTS.md "Development Workflow"). `cargo xtask ci` replicates every
# check in order and stops on the first failure: fmt, clippy, the check-arch
# boundary guard (incl. the cargo-deny dependency-direction layer), a release
# build, the workspace unit/integration tests, `cargo deny check`, and the full
# acceptance suite (FOUNDRY_ACCEPTANCE_TAGS=all, including the @docker-compose
# and @needs-pgclient groups).
#
# Because CI and the local gate are the SAME command, "green locally" and
# "green in CI" cannot drift. Do NOT add bespoke check steps here — add them to
# `xtask::run_ci` so they also run locally. The only job-level work below is
# installing the toolchain/tools `cargo xtask ci` expects on PATH.
#
# Rust toolchain is pinned via rust-toolchain.toml (1.91); rustup auto-selects
# it when cargo runs. The Swatinem/rust-cache layer is keyed on Cargo.lock.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of this workflow for the same ref when a new
# commit lands. Reduces queue time on PRs pushed in quick succession.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # sqlx refuses to talk to a missing DB at compile time when unset; the
  # workspace test step boots a Postgres (service container below).
  SQLX_OFFLINE: "true"

jobs:
  # One job, one command. `cargo xtask ci` IS the gate — locally and here.
  ci:
    name: cargo xtask ci (local-parity gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Some workspace integration tests connect to DATABASE_URL; the
      # acceptance suite spins its own Postgres via testcontainers. Providing
      # the service keeps both paths satisfied with no local divergence (locally
      # the same tests use testcontainers).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry
          POSTGRES_DB: foundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U foundry -d foundry"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=20
    env:
      DATABASE_URL: postgres://foundry:foundry@localhost:5432/foundry
      # Force the @docker-compose + acceptance group on (ubuntu-latest ships a
      # running dockerd). Without this, xtask auto-detects and would still run
      # it on the runner — set explicitly so the intent is unambiguous.
      FOUNDRY_XTASK_INCLUDE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rustup honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # Tools `cargo xtask ci` expects on PATH. It checks for each and fails
      # with an install hint if missing; we install them up front so the gate
      # runs clean. (Same tools a developer installs once locally.)
      - name: Install cargo-deny + PostgreSQL 16 client
        run: |
          cargo install --locked cargo-deny || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version

      # The single gate. Seeds .env from .env.example, runs every check in the
      # same order as the local pre-push gate, and builds the foundry binary +
      # the one shared acceptance image as part of the run.
      - name: cargo xtask ci
        run: cargo run -q -p xtask -- ci
