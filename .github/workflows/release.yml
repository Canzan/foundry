# Foundry container release workflow.
#
# Two triggers:
#   - push to main          -> publishes `:main` + `:sha-<7chars>`
#   - tag push `v*.*.*`     -> publishes `:vX.Y.Z`, `:vX.Y`, `:latest`
#
# The image is built multi-arch (linux/amd64 + linux/arm64), signed
# keyless via Cosign + GitHub OIDC, and accompanied by a CycloneDX SBOM
# from Syft. All attestations attach to the image in the registry.
#
# Registry: ghcr.io/<owner>/foundry. Cross-pushing to the Forgejo
# registry is handled by .forgejo/workflows/ci.yml on Forgejo mirrors.

name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # push to ghcr.io
  id-token: write       # OIDC token for keyless cosign signing
  attestations: write   # build provenance attestation

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/foundry

jobs:
  build-publish:
    name: build + publish + sign
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action computes the full tag set from the
      # current ref. On main: `:main` + `:sha-abc1234`. On a `vX.Y.Z`
      # tag: `:vX.Y.Z`, `:vX.Y`, `:latest`.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # gha cache cuts incremental rebuilds from ~6 min to <2 min
          # for unchanged Cargo.lock.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: false   # we generate our own SBOM below with Syft

      # ----------------------------------------------------------------
      # Sign every published tag with keyless cosign (sigstore + OIDC).
      # No long-lived keys; the attestation is bound to the workflow
      # identity. Verifiers run:
      #   cosign verify ghcr.io/<owner>/foundry:vX.Y.Z \
      #     --certificate-identity-regexp "https://github.com/<owner>/foundry" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # ----------------------------------------------------------------
      - uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      # ----------------------------------------------------------------
      # Generate an SPDX SBOM with syft and attach it as a cosign
      # attestation. One SBOM per push (the digest is identical across
      # tags pointing at the same manifest).
      # ----------------------------------------------------------------
      - uses: anchore/sbom-action@v0
        id: sbom
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM attestation (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90
