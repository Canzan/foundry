# TEMPLATE — DO NOT COMMIT REAL SECRETS.
#
# Copy this file to `foundry-secret.yaml`, fill in the values, and
# kubectl apply it. The .gitignore covers the copy so it stays local.
#
# Production deployments should source these via External Secrets
# Operator (ESO) syncing from Vault / AWS Secrets Manager / etc., or
# via sealed-secrets if the operator wants to keep the encrypted
# manifest in git. Both are out of scope for the MVP bundle; the
# template form makes either approach a 1-file change.

apiVersion: v1
kind: Secret
metadata:
  name: foundry-db-credentials
  namespace: foundry
  labels:
    app.kubernetes.io/name: foundry-db
type: Opaque
stringData:
  POSTGRES_USER: foundry
  # CHANGE ME — generate with `openssl rand -base64 24`.
  POSTGRES_PASSWORD: REPLACE_WITH_RANDOM_PASSWORD
  POSTGRES_DB: foundry

---
apiVersion: v1
kind: Secret
metadata:
  name: foundry-app-secrets
  namespace: foundry
  labels:
    app.kubernetes.io/name: foundry-app
type: Opaque
stringData:
  # MUST match foundry-db-credentials above. The app uses this single
  # URL; we keep them in two separate Secrets so an operator wiring
  # ESO can pull POSTGRES_PASSWORD from a vault and template the URL
  # here without exposing the raw password in plaintext k8s objects.
  DATABASE_URL: "postgres://foundry:REPLACE_WITH_RANDOM_PASSWORD@foundry-db.foundry.svc.cluster.local:5432/foundry"

  # HMAC key for cookie integrity + bootstrap/invite tokens. Must be
  # at least 32 bytes. Generate with `openssl rand -base64 48`.
  SESSION_SECRET: "REPLACE_WITH_AT_LEAST_32_BYTES_OF_RANDOM"

  # SMTP optional — leave blank for the noop email sender (invite
  # links are still printed to logs; password reset still works
  # against the printed token but no email goes out).
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_ADDRESS: ""
