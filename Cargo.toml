[workspace]
resolver = "2"
members = [
    "crates/foundry-core",
    "crates/foundry-store",
    "crates/foundry-auth",
    "crates/foundry-oidc",
    "crates/foundry-realtime",
    # Feature A "Programmatic Foundry" (web-tier-extraction) — RED scaffold
    # crates created by DISTILL (Mandate 7). Standalone (not yet depended on by
    # foundry-app or the binary), so they compile independently and leave the
    # existing acceptance suite green. DELIVER fleshes them out and wires them in.
    "crates/foundry-services",
    "crates/foundry-api",
    "crates/foundry-app",
    "crates/foundry-acceptance",
    "xtask",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
authors = ["Foundry Contributors"]
repository = "https://github.com/foundry-project/foundry"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web stack
axum = { version = "0.8", features = ["macros", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "fs", "limit", "request-id", "util"] }

# Templating
askama = { version = "0.12" }

# Data
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
    "json",
    "chrono",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
chrono = { version = "0.4", features = ["serde"] }

# Auth
tower-sessions = { version = "0.14" }
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
argon2 = { version = "0.5" }
password-hash = { version = "0.5" }
hmac = "0.12"
sha2 = "0.10"
# Feature A (US-W05b, ADR-W02) — machine-token JWTs signed with Ed25519
# (EdDSA). MIT-licensed; EdDSA supported on the default `ring` backend
# (already in the tree via rustls). This is the ONLY net-new runtime dep.
jsonwebtoken = "9"
subtle = "2"
secrecy = { version = "0.10", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# Markdown / sanitization
pulldown-cmark = "0.12"
ammonia = "4"

# Errors / serialization
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

# Email
lettre = { version = "0.11", default-features = false, features = [
    "tokio1",
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-log = "0.2"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }

# Config
dotenvy = "0.15"

# Acceptance test stack
cucumber = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "blocking", "stream"] }
scraper = "0.20"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
# keyboard-shortcut-bindings ADR-007 — the @needs-browser lane. W3C WebDriver
# (driver-agnostic: chromedriver OR geckodriver), async/tokio, small surface.
# NO TLS feature: the lane speaks plain HTTP to a chromedriver on 127.0.0.1, so
# it supplies its own `HttpConnector` via `ClientBuilder::new`. This is not
# merely leaner — enabling `rustls-tls` pulls hyper-rustls in beside reqwest's
# rustls and the process cannot then resolve a default CryptoProvider
# ("Could not automatically determine the process-level CryptoProvider"), and
# `native-tls` (the crate default) would drag in openssl. Both would be TLS
# machinery for a loopback connection that never uses it.
fantoccini = { version = "0.21", default-features = false }
# The plain `HttpConnector` handed to `fantoccini::ClientBuilder::new` above.
# Already in the graph via axum; named here so the acceptance crate can construct one.
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
assert_cmd = "2"
serde_yaml_ng = "0.10"

# Form decoding
serde_urlencoded = "0.7"

# One-shot init for the test harness
once_cell = "1"
# US-04 — per-scenario temp directory for staging runtime migrations.
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
